<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Veille Appels d'Offres Burundi — Magic Logistic Company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#0d9488; --teal-dark:#0f766e; --teal-soft:#ccfbf1;
  --paper:#f7f5f0; --card:#ffffff; --ink:#1c2420; --muted:#6b7670;
  --line:#e8e4da; --amber:#b45309; --amber-bg:#fef3c7;
  --red:#b91c1c; --red-bg:#fee2e2; --green:#15803d; --green-bg:#dcfce7;
  --radius:14px; --shadow:0 1px 3px rgba(28,36,32,.08),0 4px 14px rgba(28,36,32,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;padding-bottom:76px}
header{background:var(--teal-dark);color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:20}
header .brand{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
header h1{font-size:19px;font-weight:800;line-height:1.25;margin-top:2px}
header .sub{font-size:12.5px;opacity:.85;margin-top:3px}
main{max-width:860px;margin:0 auto;padding:14px 12px 8px}
.screen{display:none}
.screen.active{display:block}
h2.st{font-size:16px;font-weight:700;margin:16px 2px 10px}
h2.st:first-child{margin-top:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.stat .n{font-size:26px;font-weight:800;color:var(--teal-dark);line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted);margin-top:3px;font-weight:500}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.b-new{background:var(--teal-soft);color:var(--teal-dark)}
.b-pdf{background:#e0e7ff;color:#3730a3}
.b-ok{background:var(--green-bg);color:var(--green)}
.b-ko{background:var(--red-bg);color:var(--red)}
.b-warn{background:var(--amber-bg);color:var(--amber)}
.b-grey{background:#f1efe9;color:var(--muted)}
.b-ex{background:#e5e7eb;color:#4b5563}
.deadline{font-weight:700;color:var(--teal-dark);white-space:nowrap}
.deadline.soon{color:var(--red)}
.deadline.past{color:var(--muted);text-decoration:line-through}
.tt{font-weight:600;font-size:14.5px;line-height:1.35}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.detail{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px;font-size:13.5px}
.detail.open{display:block}
.detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.detail dt{color:var(--muted);font-weight:500}
.detail dd{font-weight:600;word-break:break-word}
.detail a{color:var(--teal-dark);font-weight:600;text-decoration:none}
.detail a:hover{text-decoration:underline}
.fiche-h{font-weight:700;color:var(--teal-dark);font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.fiche-h .comp{float:right;background:var(--teal-bg,#e6f4f1);border-radius:999px;padding:1px 9px;font-size:12px;text-transform:none;letter-spacing:0}
.objet{font-size:14px;line-height:1.45;margin:0 0 10px;font-weight:500}
.conds{margin-top:9px}
.conds b{color:var(--teal-dark)}
.conds ul{margin:4px 0 0 17px;padding:0}
.conds li{margin:3px 0;line-height:1.4}
.chev{color:var(--muted);font-size:13px;white-space:nowrap;padding-top:2px}
.tender{cursor:pointer}
input[type=search]{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;margin-bottom:10px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.toggle{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;margin:2px 2px 12px;cursor:pointer}
.toggle input{width:17px;height:17px;accent-color:var(--teal)}
.empty{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.note{font-size:12.5px;color:var(--muted);margin:8px 2px}
.err{font-size:12px;color:var(--red);word-break:break-word;margin-top:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;font:inherit;font-size:11px;font-weight:600;color:var(--muted);padding:9px 2px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ic{font-size:19px;line-height:1}
nav button.on{color:var(--teal-dark)}
.subcard{opacity:.75;border:1.5px dashed var(--line)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #f3f0e8;font-size:13.5px}
.kv:last-child{border-bottom:none}
.kv b{font-weight:600;text-align:right}
.foot{text-align:center;color:var(--muted);font-size:12px;padding:14px 8px 4px}
</style>
</head>
<body>
<header>
  <div class="brand">Magic Logistic Company</div>
  <h1>Veille Appels d'Offres — Burundi</h1>
  <div class="sub" id="hdr-sub">Chargement des données…</div>
</header>

<main>
  <!-- VUE D'ENSEMBLE -->
  <section class="screen active" id="s-home">
    <div class="grid" id="stats"></div>
    <h2 class="st">⏰ Fermetures proches (7 jours)</h2>
    <div id="closing"></div>
    <h2 class="st">Derniers avis ajoutés</h2>
    <div id="latest"></div>
  </section>

  <!-- APPELS D'OFFRES -->
  <section class="screen" id="s-tenders">
    <input type="search" id="q" placeholder="Rechercher un avis, un acheteur, une référence…">
    <div class="chips" id="chips"></div>
    <label class="toggle"><input type="checkbox" id="show-expired"> Afficher aussi les avis expirés</label>
    <div id="tender-list"></div>
    <p class="note" id="tender-count"></p>
  </section>

  <!-- ABONNÉS -->
  <section class="screen" id="s-subs">
    <div id="sub-list"></div>
    <p class="note">Registre en lecture seule. La gestion complète des abonnements (inscription, activation, envois) arrive en phase 2.</p>
  </section>

  <!-- ENVOIS -->
  <section class="screen" id="s-sends">
    <div id="send-list"></div>
  </section>

  <!-- SOURCES -->
  <section class="screen" id="s-sources">
    <div id="source-list"></div>
    <h2 class="st">Analyse des documents PDF</h2>
    <div class="card" id="pdf-stats"></div>
  </section>

  <div class="foot" id="foot"></div>
</main>

<nav id="tabs">
  <button data-s="s-home" class="on"><span class="ic">🏠</span>Accueil</button>
  <button data-s="s-tenders"><span class="ic">📋</span>Appels d'offres</button>
  <button data-s="s-subs"><span class="ic">👥</span>Abonnés</button>
  <button data-s="s-sends"><span class="ic">✉️</span>Envois</button>
  <button data-s="s-sources"><span class="ic">📡</span>Sources</button>
</nav>

<script>
const NL = 'non lu';
let D = null;
const $ = s => document.querySelector(s);
const esc = s => (s==null||s==='' ? '' : String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => { const d=new Date(); return d.toISOString().slice(0,10); };
const fmtDate = iso => { if(!iso) return NL; const [y,m,dd]=iso.split('-'); const mois=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.']; return `${+dd} ${mois[+m-1]} ${y}`; };
const daysLeft = iso => iso ? Math.round((new Date(iso+'T12:00:00') - new Date(today()+'T12:00:00'))/86400000) : null;

function dlBadge(t){
  if(!t.deadline) return '<span class="badge b-grey">date limite '+NL+'</span>';
  const n = daysLeft(t.deadline);
  if(n < 0) return `<span class="deadline past">${fmtDate(t.deadline)}</span>`;
  if(n <= 7) return `<span class="deadline soon">⏰ ${fmtDate(t.deadline)} · J-${n}</span>`;
  return `<span class="deadline">${fmtDate(t.deadline)}</span>`;
}
function ficheHtml(t, id, srcLinks){
  const r = t.resume || {};
  const V = v => (v==null||v==='' ? NL : esc(v));
  const conds = (r.conditions||[]).length
    ? `<div class="conds"><b>Conditions clés</b><ul>${r.conditions.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div>` : '';
  const docs = (r.documents||[]).length
    ? `<div class="conds"><b>Documents administratifs à fournir</b><ul>${r.documents.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>` : '';
  const dl = t.deadline ? fmtDate(t.deadline) + (r.heure?` à ${esc(r.heure)}`:'')
    + (t.deadline_source?` <span style="color:var(--muted);font-weight:500">(source : ${esc(t.deadline_source)})</span>`:'') : NL;
  return `<div class="detail" id="${id}">
    <div class="fiche-h">📋 Fiche résumé${r.completude?`<span class="comp">complétude ${esc(r.completude)}</span>`:''}</div>
    <p class="objet">${V(r.objet)}</p>
    <dl>
      <dt>Mode de passation</dt><dd>${V(r.mode)}</dd>
      <dt>Date limite</dt><dd>${dl}</dd>
      <dt>Référence</dt><dd>${esc(t.reference)||NL}</dd>
      <dt>Lieu d'exécution / livraison</dt><dd>${V(r.lieu)}</dd>
      <dt>Délai d'exécution / livraison</dt><dd>${V(r.delai)}</dd>
      <dt>Durée du marché</dt><dd>${V(r.duree)}</dd>
      <dt>Montant estimé</dt><dd>${V(r.montant_estime)}</dd>
      <dt>Prix du dossier</dt><dd>${t.dossier_cost!=null?esc(t.dossier_cost):NL}</dd>
      <dt>Garantie de soumission</dt><dd>${t.guarantee!=null?esc(t.guarantee):NL}</dd>
      <dt>Nombre de lots</dt><dd>${t.lots!=null?esc(t.lots):NL}</dd>
      <dt>Critères d'attribution</dt><dd>${V(r.criteres)}</dd>
      <dt>Retrait du dossier</dt><dd>${V(r.retrait)}</dd>
      <dt>Contact pour le dossier</dt><dd>${V(r.contact)}</dd>
      <dt>Dépôt des offres</dt><dd>${V(r.depot)}</dd>
      <dt>Ouverture des plis</dt><dd>${V(r.ouverture)}</dd>
      <dt>Validité de l'offre</dt><dd>${V(r.validite)}</dd>
      <dt>Langue et monnaie</dt><dd>${V(r.langue_monnaie)}</dd>
      <dt>Première vue</dt><dd>${fmtDate(t.first_seen)}</dd>
      ${t.pdf_enriched?'<dt>Détails</dt><dd>📄 détails lus dans le PDF analysé</dd>':''}
      ${t.pdf_url?`<dt>Document</dt><dd><a href="${esc(t.pdf_url)}" target="_blank" rel="noopener">Ouvrir le PDF de l\u2019avis</a></dd>`:''}
      <dt>Sources</dt><dd>${srcLinks||NL}</dd>
    </dl>${conds}${docs}
  </div>`;
}
function tenderCard(t, expandable=true){
  const id = 'd' + Math.random().toString(36).slice(2,9);
  const srcLinks = (t.sources||[]).map(s => s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name||'Source')}</a>` : esc(s.name||'')).filter(Boolean).join(' · ');
  return `<div class="card tender" data-id="${id}">
    <div class="row"><div>
      <div class="tt">${esc(t.title||'(sans titre)')}</div>
      <div class="meta">${esc(t.buyer||'Acheteur '+NL)} · ${esc(t.sector||'')} ${t.is_new?'<span class="badge b-new">Nouveau</span>':''} ${t.pdf_enriched?'<span class="badge b-pdf">📄 PDF analysé</span>':''}</div>
    </div><div style="text-align:right">${dlBadge(t)}<div class="chev">${expandable?'détail ▾':''}</div></div></div>
    ${expandable?ficheHtml(t, id, srcLinks):''}
  </div>`;
}

function render(){
  const t0 = today();
  const tenders = D.tenders;
  const actifs = tenders.filter(t => t.deadline && t.deadline >= t0);
  const closing7 = actifs.filter(t => daysLeft(t.deadline) <= 7);
  const news = tenders.filter(t => t.is_new);
  const subsActifs = D.subscribers.filter(s => s.actif && !s.is_example).length;

  $('#hdr-sub').textContent = `Dernier passage du scanner : ${fmtDate(D.run.date)} · ${tenders.length} avis suivis`;
  $('#foot').textContent = `Données générées le ${new Date(D.generated_at).toLocaleString('fr-FR')} · Magic Logistic Company`;

  $('#stats').innerHTML = [
    [news.length, 'Nouveaux avis au dernier passage'],
    [actifs.length, 'Avis actifs (date limite à venir)'],
    [closing7.length, 'Fermetures sous 7 jours'],
    [subsActifs, 'Abonnés actifs'],
    [`${D.run.sources_ok}/${D.run.sources_total}`, 'Sources opérationnelles'],
    [tenders.filter(t=>t.pdf_enriched).length, 'Avis enrichis par analyse PDF'],
  ].map(([n,l]) => `<div class="stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

  $('#closing').innerHTML = closing7.length
    ? closing7.slice(0,12).map(t => tenderCard(t)).join('')
    : '<div class="empty">Aucune fermeture dans les 7 prochains jours.</div>';

  const latest = [...news].sort((a,b) => (b.first_seen||'').localeCompare(a.first_seen||'')).slice(0,6);
  $('#latest').innerHTML = latest.length ? latest.map(t => tenderCard(t)).join('') : '<div class="empty">Aucun nouvel avis au dernier passage.</div>';

  renderChips(); renderTenders(); renderSubs(); renderSends(); renderSources();
  bindCards();
}

let curSector = 'Tous';
function renderChips(){
  const sectors = ['Tous', ...new Set(D.tenders.map(t => t.sector).filter(Boolean).sort())];
  $('#chips').innerHTML = sectors.map(s => `<button class="chip ${s===curSector?'on':''}" data-sec="${esc(s)}">${esc(s)}</button>`).join('');
  document.querySelectorAll('.chip').forEach(c => c.onclick = () => { curSector = c.dataset.sec; renderChips(); renderTenders(); bindCards(); });
}
function renderTenders(){
  const q = ($('#q').value||'').toLowerCase();
  const showExp = $('#show-expired').checked;
  const t0 = today();
  const list = D.tenders.filter(t => {
    if(curSector !== 'Tous' && t.sector !== curSector) return false;
    if(!showExp && t.deadline && t.deadline < t0) return false;
    if(q && !(`${t.title||''} ${t.buyer||''} ${t.reference||''}`.toLowerCase().includes(q))) return false;
    return true;
  });
  $('#tender-list').innerHTML = list.length ? list.map(t => tenderCard(t)).join('') : '<div class="empty">Aucun avis ne correspond à ce filtre.</div>';
  $('#tender-count').textContent = `${list.length} avis affiché(s) sur ${D.tenders.length} suivis.`;
}
function renderSubs(){
  if(!D.subscribers.length){ $('#sub-list').innerHTML = '<div class="empty">Aucun abonné inscrit pour le moment.</div>'; return; }
  $('#sub-list').innerHTML = D.subscribers.map(s => `<div class="card ${s.is_example?'subcard':''}">
    <div class="row"><div class="tt">${esc(s.entreprise)}</div>
    ${s.is_example ? '<span class="badge b-ex">Exemple</span>' : (s.actif ? '<span class="badge b-ok">Actif</span>' : '<span class="badge b-grey">Inactif</span>')}</div>
    <div style="margin-top:8px">
      <div class="kv"><span>Secteurs suivis</span><b>${esc((s.sectors||[]).join(', '))||NL}</b></div>
      <div class="kv"><span>E-mail</span><b>${esc(s.email)||NL}</b></div>
      <div class="kv"><span>WhatsApp</span><b>${esc(s.whatsapp)||NL}</b></div>
      <div class="kv"><span>Payé jusqu'au</span><b>${fmtDate(s.paye_jusqu_au)}</b></div>
    </div></div>`).join('');
}
function renderSends(){
  const s = D.sends;
  if(!s || !s.entries || !s.entries.length){
    $('#send-list').innerHTML = '<div class="empty">Aucun envoi préparé pour le moment.<br>Les digests par abonné apparaîtront ici après chaque passage du scanner.</div>';
    return;
  }
  $('#send-list').innerHTML =
    `<p class="note">Résumé du ${fmtDate(s.date)} · passage ${esc(s.source_run||'')} · ${s.total_new!=null?s.total_new+' avis nouveaux au total':''}</p>` +
    s.entries.map(e => `<div class="card ${e.is_example?'subcard':''}">
      <div class="row"><div class="tt">${esc(e.entreprise)}</div>
      ${e.is_example?'<span class="badge b-ex">Exemple</span>':''}</div>
      <div class="meta">${e.matched} avis correspondants · secteurs : ${esc((e.sectors||[]).join(', '))}</div>
      <div style="margin-top:8px">
        <div class="kv"><span>✉️ E-mail</span><b>${esc(e.email_status)||NL}</b></div>
        <div class="kv"><span>💬 WhatsApp</span><b>${esc(e.whatsapp_status)||NL}</b></div>
      </div></div>`).join('');
}
function renderSources(){
  $('#source-list').innerHTML =
    `<p class="note">Dernier passage : ${fmtDate(D.run.date)} · ${D.run.total_uniques!=null?D.run.total_uniques+' avis uniques collectés · ':''}${D.run.nb_nouveaux!=null?D.run.nb_nouveaux+' nouveaux · ':''}${D.run.nb_expires!=null?D.run.nb_expires+' expirés écartés':''}</p>` +
    D.run.sources.map(s => `<div class="card"><div class="row">
      <div><div class="tt">${esc(s.name)}</div>
      ${s.status==='OK' ? `<div class="meta">${s.count!=null?s.count+' avis collectés':''}</div>` : `<div class="err">${esc(s.error||'Échec sans détail')}</div>`}
      </div>${s.status==='OK' ? '<span class="badge b-ok">OK</span>' : '<span class="badge b-ko">ÉCHEC</span>'}
    </div></div>`).join('');
  const p = D.run.pdf || {};
  const row = (l,v) => `<div class="kv"><span>${l}</span><b>${v!=null?v:NL}</b></div>`;
  $('#pdf-stats').innerHTML =
    row('PDF téléchargés au dernier passage', p.downloaded) +
    row('PDF repris du cache', p.cached) +
    row('Textes extraits directement', p.text_ok) +
    row('OCR réussis (documents scannés)', p.ocr_ok) +
    row('OCR en échec', p.ocr_failed) +
    row('Téléchargements en échec', p.failed) +
    ((p.failures&&p.failures.length) ? `<div class="err" style="margin-top:8px">${p.failures.map(f => esc((f.url||'').split('/').pop()) + ' — ' + esc((f.error||'').slice(0,80))).join('<br>')}</div>` : '');
}
function bindCards(){
  document.querySelectorAll('.tender').forEach(c => {
    c.onclick = () => { const d = c.querySelector('.detail'); if(d) d.classList.toggle('open'); };
  });
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x===b));
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === b.dataset.s));
  window.scrollTo(0,0);
});
$('#q').addEventListener('input', () => { renderTenders(); bindCards(); });
$('#show-expired').addEventListener('change', () => { renderTenders(); bindCards(); });

fetch('data.json').then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { D = d; render(); })
  .catch(e => { $('#hdr-sub').textContent = 'Données momentanément indisponibles.'; $('#stats').innerHTML = '<div class="empty">Impossible de charger les données du scanner. Réessayez dans un moment.</div>'; });
</script>
</body>
</html>
