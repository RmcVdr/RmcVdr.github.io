<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Boutique MLC — Magic Logistic Company</title>
<style>
:root{
  --pri:#304FFE; --pri-d:#2440d8; --txtblue:#337CFF; --cyan:#00BCD4; --orange:#F97316;
  --rail:#0B1520; --bg:#ffffff; --pale:#F2F5FE; --ink:#16233c; --mut:#64748b; --line:#E5E7EB;
  --field:#EDF0F4; --softbg:#E0E7FF; --actbg:#ACBCFE; --acttx:#4973E8; --subact:#D5DEFE;
  --green:#16a34a; --red:#dc2626; --amber:#f59e0b; --violet:#7c3aed; --lime:#C1D82F; --wa:#25D366;
  --r:14px; --sh:0 1px 3px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
a{color:var(--txtblue);text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#c3cede;border-radius:4px}

/* ===== Coquille : rail sombre + en-tête + colonnes ===== */
#app{display:flex;min-height:100vh}
#side{width:80px;background:var(--rail);color:#94A3B8;position:fixed;top:0;bottom:0;left:0;z-index:80;display:flex;flex-direction:column;align-items:stretch}
#side .logomark{margin:14px auto 8px;width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#304FFE,#7C4DFF);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;letter-spacing:-.5px}
#side nav{display:flex;flex-direction:column;gap:2px;padding:6px 0;flex:1;overflow-y:auto}
#side nav a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;color:#94A3B8;font-size:10.5px;font-weight:600;position:relative}
#side nav a svg{width:24px;height:24px}
#side nav a:hover{color:#fff}
#side nav a.on{color:#fff}
#side nav a.on:before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3.5px;border-radius:3px;background:var(--pri)}
#side nav a .bdot{position:absolute;top:5px;right:16px;width:9px;height:9px;border-radius:50%;background:#EF4444;border:1.5px solid var(--rail)}
#side .ver{padding:9px 2px 12px;text-align:center;font-size:10px;color:#5B6B82}
#main{flex:1;margin-left:80px;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px;height:57px}
#top .crumb{display:flex;align-items:center;gap:9px;color:var(--mut);font-size:14.5px;white-space:nowrap;overflow:hidden}
#top .crumb .hic{color:#94A3B8;display:inline-flex}
#top .crumb .hic svg{width:19px;height:19px}
#top .crumb b{color:var(--ink);font-weight:600}
#top .crumb .sep{color:#C3CEDF}
#top .sp{flex:1}
#top .datepill{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
#top .bizname{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14.5px;color:var(--ink);white-space:nowrap}
#top .bizname .bav{width:32px;height:32px;border-radius:8px;background:var(--lime);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;overflow:hidden;font-size:16px}
.iconbtn{position:relative;background:none;border:0;color:#64748B;padding:7px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--pale);color:var(--ink)}
.iconbtn svg{width:21px;height:21px}
.bellbadge{position:absolute;top:1px;right:1px;background:#EF4444;color:#fff;font-size:9.5px;font-weight:800;border-radius:99px;padding:0.5px 5px;line-height:1.5}
#body{display:flex;align-items:flex-start;flex:1;min-width:0}
#subcol,#subcol2{flex:none;background:#fff;border-right:1px solid var(--line);position:sticky;top:57px;height:calc(100vh - 57px);overflow-y:auto;padding:12px 10px}
#subcol{width:196px}
#subcol2{width:186px}
#content{flex:1;min-width:0;padding:20px 22px 90px;max-width:1240px}
#content.pale{background:var(--pale)}
#scrim{display:none}
#tabbar{display:none}

/* Navigation secondaire verticale */
.bizhead{display:flex;align-items:center;gap:9px;padding:5px 8px 13px;border-bottom:1px solid var(--line);margin-bottom:10px}
.bizhead .bav{width:34px;height:34px;border-radius:8px;background:var(--lime);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;font-size:16px;overflow:hidden}
.bizhead .bn{font-weight:700;font-size:14.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bizhead .sw{color:var(--mut);font-size:15px}
.subnav{display:flex;flex-direction:column;gap:2px}
.subnav a{display:flex;align-items:center;gap:10px;padding:8.5px 11px;border-radius:8px;color:#3c4b61;font-size:14px;font-weight:500}
.subnav a svg{width:18px;height:18px;flex:none;color:#8494ab}
.subnav a:hover{background:var(--pale)}
.subnav a.on{background:var(--actbg);color:var(--acttx);font-weight:600}
.subnav a.on svg{color:var(--acttx)}
#subcol.insettings .subnav a.on{background:var(--line);color:var(--ink)}
#subcol.insettings .subnav a.on svg{color:var(--ink)}
.navsec{font-size:11.5px;color:#94A3B8;font-weight:600;padding:13px 11px 5px}
.vtabs{display:flex;flex-direction:column;gap:2px}
.vtabs a{display:flex;align-items:center;gap:10px;padding:8.5px 11px;border-radius:8px;color:#3c4b61;font-size:14px;font-weight:500}
.vtabs a svg{width:18px;height:18px;flex:none;color:#8494ab}
.vtabs a:hover{background:var(--pale)}
.vtabs a.on{background:var(--subact);color:var(--acttx);font-weight:600}
.vtabs a.on svg{color:var(--acttx)}
.vtabs.greyact a.on{background:var(--line);color:var(--ink)}
.vtabs.greyact a.on svg{color:var(--ink)}

/* ===== Générique ===== */
h1{font-size:27px;font-weight:800;letter-spacing:-.3px}
h2{font-size:19px;font-weight:700}
h3{font-size:15.5px;font-weight:700}
.pagehead{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.pagehead .sp{flex:1}
.pagehead p{color:var(--mut);font-size:13.5px;margin-top:2px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh)}
.stat .lb{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.stat .vl{font-size:21px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .vl small{font-size:12px;color:var(--mut);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--pri);color:#fff;border:0;border-radius:6px;padding:9px 16px;font-weight:600;font-size:14px;min-height:38px}
.btn:hover{background:var(--pri-d)}
.btn.dark{background:#111827} .btn.dark:hover{background:#1f2937}
.btn.ghost{background:var(--line);color:var(--ink);border:0} .btn.ghost:hover{background:#d4d9e0}
.btn.soft{background:var(--softbg);color:var(--pri)} .btn.soft:hover{background:#cbd7fd}
.btn.cyan{background:var(--cyan);color:#fff} .btn.cyan:hover{background:#00a5bb}
.btn.orange{background:var(--orange);color:#fff} .btn.orange:hover{background:#ea580c}
.btn.red{background:var(--red)} .btn.green{background:var(--green)}
.btn.danger{background:#FEE2E2;color:#B91C1C} .btn.danger:hover{background:#fecaca}
.btn.sm{padding:5px 11px;font-size:13px;border-radius:6px;min-height:31px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:520px}
th{text-align:left;padding:11px 12px;color:var(--mut);font-size:13px;font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff}
td{padding:13px 12px;border-bottom:1px solid #EFF2F6;vertical-align:middle;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:#F1F5F9}
tr:last-child td{border-bottom:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--softbg);color:var(--pri);white-space:nowrap}
.badge.green{background:#DCFCE7;color:#3BB089}.badge.red{background:#FEE2E2;color:#DC2626}
.badge.orange{background:#FFEDD5;color:#EA580C}.badge.grey{background:var(--line);color:#6B7280}
.badge.violet{background:#ede9fe;color:#6d28d9}
.dot{width:9px;height:9px;border-radius:50%;background:var(--orange);display:inline-block;flex:none}
.empty{padding:34px 16px;text-align:center;color:var(--mut)}
.empty .big{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:4px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:500;color:#5B6B82;margin-bottom:5px}
.field label small{color:var(--mut);font-weight:400}
.inp,select.inp,textarea.inp{width:100%;border:1px solid #E1E5EB;border-radius:7px;padding:9px 11px;background:var(--field);font-size:14.5px;min-height:40px}
.inp:focus{outline:2px solid #B9C8FE;border-color:var(--pri);background:#fff}
textarea.inp{min-height:74px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters .inp{width:auto;flex:1;min-width:120px}
.switch{position:relative;width:42px;height:23px;flex:none;display:inline-block;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.switch .tr{position:absolute;inset:0;background:#D1D5DB;border-radius:20px;transition:.2s}
.switch .tr:before{content:"";position:absolute;width:17px;height:17px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.switch input:checked + .tr{background:var(--pri)}
.switch input:checked + .tr:before{transform:translateX(19px)}
.setrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #EFF2F6}
.setrow:last-child{border-bottom:0}
.setrow .tx{flex:1;min-width:0}
.setrow .tx .t{font-weight:600;font-size:14.5px}
.setrow .tx .d{font-size:12.5px;color:var(--mut)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs a{padding:9px 13px;font-weight:600;font-size:14px;color:var(--mut);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs a.on{color:var(--pri);border-color:var(--pri)}
.note{background:#FFF7ED;border:1px solid #FED7AA;color:#9A3412;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.note.blue{background:#EFF4FF;border-color:#B9C8FE;color:#2440A0}
.note.red{background:#FEF2F2;border-color:#FECACA;color:#991B1B}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7.5px 0;border-bottom:1px dashed #E8EDF4;font-size:14px;align-items:baseline}
.kv:last-child{border-bottom:0}.kv b{font-variant-numeric:tabular-nums;text-align:right}
.check{color:var(--green);font-weight:800}.cross{color:var(--red);font-weight:800}
.mut{color:var(--mut)} .small{font-size:12.5px} .b{font-weight:700}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.strike{text-decoration:line-through;color:var(--mut);font-weight:400;font-size:.88em;margin-left:5px}
.pthumb{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none;color:#fff;position:relative;overflow:hidden}
.pthumb img{width:100%;height:100%;object-fit:cover}
.medbadge{position:absolute;right:-2px;bottom:-2px;background:var(--pri);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:92vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:250;display:none;align-items:flex-end;justify-content:center;background:rgba(5,12,25,.55)}
.modal.open{display:flex}
.modal .box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px 26px;position:relative}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:16px}}
.mhead{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
.mhead .sp{flex:1}
.mhead h2{padding-right:6px}
.xbtn{background:var(--pale);border:1px solid var(--line);width:32px;height:32px;border-radius:50%;font-size:15px;flex:none;color:var(--mut)}
.earn{position:fixed;right:16px;bottom:24px;z-index:90;background:var(--pri);color:#fff;border:0;border-radius:50%;width:54px;height:54px;font-size:24px;box-shadow:0 8px 22px rgba(48,79,254,.45);display:flex;align-items:center;justify-content:center}
.earn:after{content:"";position:absolute;top:2px;right:2px;width:11px;height:11px;border-radius:50%;background:#EF4444;border:2px solid #fff}
.bar{height:8px;background:#E2E8F0;border-radius:99px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:99px}
.chk{width:17px;height:17px;accent-color:var(--pri)}

/* ===== Accueil (home) ===== */
.modcard2{display:block;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px 24px;box-shadow:var(--sh);color:var(--ink);margin-bottom:16px;position:relative}
.modcard2 .mh{display:flex;align-items:flex-start;gap:16px}
.modcard2 .tile{width:56px;height:56px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:29px;flex:none}
.modcard2 h3{font-size:22px;font-weight:800}
.modcard2 .desc{color:var(--mut);font-size:14px;margin-top:3px;max-width:520px}
.modcard2 .visitbtn{margin-left:auto;flex:none;background:var(--pri);color:#fff;border-radius:99px;padding:12px 26px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:8px}
.modcard2 .visitbtn:hover{background:var(--pri-d)}
.checklist{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;margin-top:14px;max-width:560px}
.checklist span{font-size:14px;color:#33415C}
.checklist .ck{color:#22C55E;font-weight:800;margin-right:7px}
.panelrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.panelrow{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.panel h3{font-size:16.5px;margin-bottom:6px}
.yourplan{display:inline-block;background:var(--line);color:#4B5563;font-size:12px;font-weight:700;border-radius:6px;padding:3px 10px}

/* ===== Dashboards ===== */
.dashhead{margin-bottom:6px}
.dashhead .hi{font-size:26px;font-weight:800}
.dashicon{width:52px;height:52px;border-radius:50%;background:#E8ECF3;display:flex;align-items:center;justify-content:center;font-size:24px;color:#8494AB;margin:14px 0 8px}
.dashhead h2{font-size:23px;font-weight:800}
.dashhead .sub{color:var(--mut);font-size:14px;margin-top:2px}
.hr{border:0;border-top:1px solid var(--line);margin:15px 0}
.actcard{background:#fff;border:1.5px solid #FDBA74;border-radius:14px;padding:16px;position:relative;box-shadow:var(--sh)}
.actcard .odot{position:absolute;top:-5px;right:-5px;width:13px;height:13px;border-radius:50%;background:var(--orange);border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.actcard .ai{font-size:27px;margin-bottom:7px}
.actcard .at{color:var(--orange);font-weight:800;font-size:16.5px;line-height:1.25}
.actcard .ad{color:var(--mut);font-size:13.5px;margin-top:5px}
.liveat{font-size:14.5px;margin:12px 0 4px}
.liveat a{font-weight:700;font-size:15.5px}
.pencil{display:inline-flex;width:24px;height:24px;border-radius:50%;background:var(--line);color:#4B5563;align-items:center;justify-content:center;font-size:12.5px;vertical-align:middle;margin-left:7px;border:0}
.sharebox{background:#F1F3F6;border-radius:10px;padding:13px 14px;margin-top:8px}
.sharebox .surl{font-weight:600;font-size:14px;word-break:break-all}
.sharebox .stag{color:#33415C;font-size:14px}
.shareicons{display:flex;gap:8px;align-items:center;margin-top:11px;flex-wrap:wrap}
.shareicons .sic{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:16px}
.shareicons .sp{flex:1}

/* ===== Barres d'outils de listes & états vides ===== */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .tt{font-size:16.5px;font-weight:800;margin-right:4px}
.toolbar .searchbox{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 11px;min-height:38px;flex:0 1 260px}
.toolbar .searchbox input{border:0;background:none;outline:none;flex:1;font-size:14px;min-width:60px}
.toolbar .searchbox .sic2{color:#94A3B8}
.ticon{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#5B6B82;display:inline-flex;align-items:center;justify-content:center;font-size:16.5px}
.ticon:hover{background:var(--pale)}
.ticon.on{background:var(--softbg);color:var(--pri);border-color:#B9C8FE}
.emptyState{text-align:center;padding:26px 16px 34px}
.emptyState .vidthumb{width:250px;max-width:80vw;height:140px;background:#0A0A0A;border-radius:10px;margin:8px auto 18px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px}
.emptyState .et{font-size:20px;font-weight:800}
.emptyState .ed{color:var(--mut);font-size:14px;margin:6px auto 16px;max-width:430px}
.emptyState .knowmore{display:block;margin-top:13px;font-weight:600;font-size:14.5px}

/* ===== Mises en page en deux colonnes (fiches) ===== */
.split{display:flex;gap:0;align-items:flex-start}
.leftcol{width:215px;flex:none;padding-right:18px;border-right:1px solid var(--line);margin-right:20px}
.leftcol .lcimg{width:100%;aspect-ratio:1.15;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;overflow:hidden;margin-bottom:12px}
.leftcol .lcimg img{width:100%;height:100%;object-fit:cover}
.leftcol .lclabel{font-size:12.5px;color:var(--mut)}
.leftcol .lcname{font-size:17px;font-weight:800;margin-bottom:12px}
.avatarBig{width:150px;height:150px;max-width:100%;border-radius:14px;background:var(--lime);display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;color:#fff;margin-bottom:12px}
.vmenu{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.vmenu a{display:flex;align-items:center;gap:10px;padding:8.5px 11px;border-radius:8px;color:#3c4b61;font-size:14px;font-weight:500}
.vmenu a svg{width:17px;height:17px;color:#8494AB;flex:none}
.vmenu a:hover{background:var(--pale)}
.vmenu a.on{background:var(--actbg);color:var(--acttx);font-weight:600}
.vmenu a.on svg{color:var(--acttx)}
.splitbody{flex:1;min-width:0}
.sectCyan{color:var(--cyan);font-size:16.5px;font-weight:700;margin:16px 0 4px}
.custcell{display:flex;gap:11px;align-items:center}

function crumbFor(route){
  const parts = route.replace(/^#\//, "").split("/").filter(Boolean);
  const mod = parts[0] || "home";
  if (mod === "home") return '<span class="hic">' + ic("home", 19) + "</span><b>Home</b>";
  const segs = [];
  if (mod === "crm" || mod === "store" || mod === "catalog") segs.push("Dashboard");
  else if (mod === "credits" || mod === "account" || mod === "help") segs.push("Home");
  else if (mod === "cards") return '<span class="hic">' + ic("home", 19) + "</span>";
  parts.slice(1).forEach(p => { const l = CRUMB_LABELS[p]; if (l) segs.push(l); else if (/^\d+$/.test(p)) segs.push("(" + p + ")"); });
  return (segs.length > 1 ? '<span style="color:var(--pri);font-weight:700">←</span>' : '<span class="hic">' + ic("home", 19) + "</span>") +
    segs.map((s, i) => (i === segs.length - 1 ? "<b>" + s + "</b>" : "<span>" + s + "</span>")).join('<span class="sep">/</span>');
}

function viewCrmDashboard(){
  const t = DB.tickets;

  const prioLine = ["Low", "Medium", "High", "Urgent"].map(p => { const n = t.filter(x => x.priority === p).length; return n ? p + " " + n : ""; }).filter(Boolean).join(" · ");

function listToolbar(title, searchId, searchFn, extra){
  return '<div class="toolbar"><span class="tt">' + title + '</span>' +
    '<span class="searchbox"><span class="sic2">' + ic("search", 17) + '</span><input id="' + searchId + '" placeholder="Search" oninput="' + searchFn + '"></span>' +
    '<button class="ticon" title="Rafraîchir" onclick="render()">↻</button>' +
    '<button class="ticon" id="filterbtn" title="Filtres" onclick="toggleFilters(this)">' + ic("filter", 17) + "</button>" +
    (extra || "") + "</div>";
}
function toggleFilters(btn){
  const f = document.getElementById("filterzone");
  if (!f) return;
  const show = f.style.display === "none";
  f.style.display = show ? "" : "none";
  btn.classList.toggle("on", show);
}

    '<div class="field"><label>Sujet</label><input class="inp" id="tk-subject" value="' + (t ? esc(t.subject) : "") + '"></div>' +

    '<div class="row"><div class="field"><label>Priorité</label><select class="inp" id="tk-prio">' + ["Low", "Medium", "High", "Urgent"].map(p => "<option" + (t && t.priority === p ? " selected" : (!t && p === "Medium" ? " selected" : "")) + ">" + p + "</option>").join("") + '</select></div>' +
    '<div class="field"><label>Statut</label><select class="inp" id="tk-status">' + DB.ticketStatuses.map(s => "<option" + (t && t.status === s.name ? " selected" : "") + ">" + esc(s.name) + "</option>").join("") + "</select></div></div>" +
    '<div class="field"><label>Date d\'échéance</label><input class="inp" type="date" id="tk-due" value="' + (t ? esc(t.due || "") : "") + '"></div>' +
    '<button class="btn" onclick="crmSaveTicket(' + (t ? "'" + t.id + "'" : "null") + ')">Enregistrer</button>');

function crmSaveTicket(id){
  const s = $("#tk-subject").value.trim(); if (!s) return toast("Sujet requis");
  const data = { subject: s, contact: $("#tk-contact").value, priority: $("#tk-prio").value, status: $("#tk-status").value, due: $("#tk-due").value, desc: $("#tk-desc").value };
  if (id){ const t = DB.tickets.find(x => x.id === id); Object.assign(t, data); toast("Ticket mis à jour ✓"); }
  else { DB.tickets.push(Object.assign({ id: uid("TK"), created: "Aujourd'hui", createdAt: todayStr() }, data)); toast("Ticket créé ✓"); }
  save(); closeModal(); render();
}
function crmDelTicket(id){ DB.tickets = DB.tickets.filter(t => t.id !== id); save(); render(); }

function applyContactFilter(){
  const v = id => { const e = document.getElementById(id); return e ? e.value : ""; };
  const m = v("f-mobile").trim(), f = v("f-funnel"), tg = v("f-tags"), st = v("f-status"), g = v("f-gender");
  const cp = presetOf("cf");
  const list = DB.contacts.filter(c =>
    (!m || c.mobile.includes(m)) && (!f || c.funnel === f) && (!tg || (c.tags || []).includes(tg)) &&
    (!st || (st === "Locked" ? c.locked : !c.locked)) && (!g || c.gender === g) &&
    inPreset(c.createdAt, cp.preset, cp.from, cp.to));
  $("#content .tblwrap table").innerHTML = contactHeadRow() + (list.map(contactRow).join("") || '<tr><td colspan="10" class="empty">Aucun contact ne correspond.</td></tr>');
  const cnt = document.getElementById("cf-count");
  if (cnt) cnt.textContent = "— " + list.length + " contact(s) affiché(s)" + (contactSel.size ? " · " + contactSel.size + " sélectionné(s)" : "");
}

function crmSaveContact(){
  const m = $("#ct-mobile").value.trim(); if (!m) return toast("Mobile requis");
  const tags = $("#ct-tags").value.split(",").map(s => s.trim()).filter(Boolean);
  tags.forEach(t => { if (!DB.tagsList.some(x => x.name === t)) DB.tagsList.push({ id: uid("t"), name: t }); });
  DB.contacts.push({ id: uid("12"), salutation: $("#ct-sal").value, name: $("#ct-name").value.trim(), mobile: m, email: $("#ct-email").value.trim(), company: $("#ct-company").value.trim(), gender: $("#ct-gender").value, city: $("#ct-city").value.trim(), address: $("#ct-address").value.trim(), notes: $("#ct-notes").value, funnel: $("#ct-funnel").value, tags, locked: false, created: "Aujourd'hui", createdAt: todayStr(), activities: [] });
  save(); closeModal(); toast("Contact créé ✓"); render();
}

function validateCoupon(code, subtotal){
  const c = DB.coupons.find(x => x.code === String(code || "").trim().toUpperCase());
  if (!c) return { ok: false, msg: "Coupon introuvable." };
  if (couponExpired(c)) return { ok: false, msg: "Ce coupon a expiré le " + c.expiry.split("-").reverse().join("/") + "." };
  if (subtotal < Number(c.fromCart || 0)) return { ok: false, msg: "Ce coupon exige un panier d'au moins " + fmtS(c.fromCart) + "." };
  if (c.maxUsage && c.used >= Number(c.maxUsage)) return { ok: false, msg: "Coupon épuisé : usage maximum atteint (" + c.maxUsage + ")." };
  if (c.tiers) return { ok: false, msg: "Coupon réservé au tier « " + c.tiers + " » : connexion du client requise." };
  let d = c.kind === "%" ? Math.round(subtotal * c.value / 100) : Number(c.value);
  if (c.maxDiscount) d = Math.min(d, Number(c.maxDiscount));
  return { ok: true, coupon: c, discount: d, msg: "Coupon appliqué : −" + fmtS(d) };
}

function applyProductFilter(){
  const body = document.getElementById("pf-body"); if (!body) return;
  const v = id => { const e = document.getElementById(id); return e ? e.value : ""; };
  const q = v("pf-q").toLowerCase(), cat = v("pf-cat"), status = v("pf-status"), stock = v("pf-stock"), vis = v("pf-vis"), type = v("pf-type"), badgeF = v("pf-badge");
  const list = DB.products.filter(p => {
    if (q && !p.name.toLowerCase().includes(q)) return false;
    if (cat && cat !== "All" && p.category !== cat) return false;
    if (status && p.status !== status) return false;
    if (stock === "in" && prodStock(p) <= 0) return false;
    if (stock === "out" && prodStock(p) > 0) return false;
    if (vis === "visible" && !p.visibility) return false;
    if (vis === "hidden" && p.visibility) return false;
    if (type && p.type !== type) return false;
    if (badgeF && !(p.badges || []).includes(badgeF)) return false;
    return true;
  });
  body.innerHTML = list.map(productRow).join("") || '<tr><td colspan="8" class="empty">Product Not Found! — aucun produit ne correspond.</td></tr>';
  const cnt = document.getElementById("pf-count");
  if (cnt) cnt.textContent = list.length + " produit(s) affiché(s) sur " + DB.products.length;
}

function inPreset(dateStr, preset, from, to){
  if (!preset || preset === "all") return true;
  const d = (dateStr || "").slice(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return false;
  const now = new Date();
  const iso = x => x.toISOString().slice(0, 10);
  const t = iso(now);
  if (preset === "today") return d === t;
  if (preset === "yesterday") return d === iso(new Date(now.getTime() - 864e5));
  if (preset === "week"){ const s = new Date(now.getTime() - ((now.getDay() + 6) % 7) * 864e5); return d >= iso(s) && d <= t; }
  if (preset === "month") return d.slice(0, 7) === t.slice(0, 7);
  if (preset === "year") return d.slice(0, 4) === t.slice(0, 4);
  if (preset === "custom") return (!from || d >= from) && (!to || d <= to);
  return true;
}

}

  const rows = DB.polls.filter(p => {
    if (q && !p.name.toLowerCase().includes(q)) return false;
    if (status && p.status !== status) return false;
    if (privacy && p.privacy !== privacy) return false;
    if (multi !== "" && String(p.multiple ? 1 : 0) !== multi) return false;
    if (store !== "" && String(p.storeVisibility ? 1 : 0) !== store) return false;
    if (!arch && p.archived) return false;
    return true;
  });
  body.innerHTML = rows.length ? rows.map((p, i) => "<tr><td>" + (i + 1) + "</td><td>" + esc(p.name) + "</td><td>" + p.votes + "</td><td>" + statusBadge(p.status) + "</td><td>" + esc(p.privacy) + "</td><td>" + (p.multiple ? "Oui" : "Non") + "</td><td>" + (p.pinned ? "📌" : "—") + "</td><td>" + (p.storeVisibility ? "Visible" : "Masqué") + "</td><td>" + (p.archived ? "Oui" : "Non") + '</td><td><button class="btn sm ghost" onclick="crmPollDetail(\'' + p.id + '\')">Résultats</button> <button class="btn sm ghost" onclick="copyText(\'Sondage : ' + esc(p.name).replace(/'/g, "") + '\',\'Lien du sondage copié ✓\')">Share</button></td><td>' + esc(p.created) + '</td><td><button class="btn sm ghost" onclick="crmPollForm(\'' + p.id + '\')">✏️</button> <button class="btn sm ghost" onclick="crmPollArchive(\'' + p.id + '\')">' + (p.archived ? "Désarchiver" : "Archiver") + '</button> <button class="btn sm ghost" onclick="crmDelPoll(\'' + p.id + '\')">🗑️</button></td></tr>').join("")
    : '<tr><td colspan="12" class="empty">Aucun sondage ne correspond.</td></tr>';
  const cnt = document.getElementById("pl-count");
  if (cnt) cnt.textContent = rows.length + " sondage(s) affiché(s) sur " + DB.polls.length;
}
function pollVoteSplit(p){
  const n = p.options.length; if (!n) return [];
  const weights = p.options.map((o, i) => ((p.name.length * (i + 3) + o.length * 7 + i * 11) % 10) + 1);
  const sum = weights.reduce((a, b) => a + b, 0);
  let used = 0;
  return p.options.map((o, i) => { const v = i === n - 1 ? p.votes - used : Math.round(p.votes * weights[i] / sum); used += v; return { label: o, votes: v }; });
}

    split.map(s => { const pct = p.votes ? Math.round(s.votes / p.votes * 100) : 0; return '<div style="margin-top:10px"><div style="display:flex;justify-content:space-between"><span>' + esc(s.label) + "</span><b>" + s.votes + " (" + pct + "%)</b></div><div class=\"bar\"><i style=\"width:" + pct + '%"></i></div></div>'; }).join("") +

}

function shopComputeTotals(){
  const sub = cartSubtotal();
  const disc = shopState.couponDiscount || 0;
  let ship = 0;
  const shipEl = document.getElementById("co-ship");
  if (shipEl) ship = Number(shipEl.value || 0);
  else if (shopState.shipVal != null) ship = Number(shopState.shipVal || 0);
  let addonTotal = 0;
  const adEls = $$(".co-addon");
  if (adEls.length) adEls.forEach(sel => { addonTotal += Number(sel.value || 0); });
  else if (shopState.addons) Object.keys(shopState.addons).forEach(k => { addonTotal += Number(shopState.addons[k] || 0); });
  let taxes = 0;
  if (S().chargesMode === "Exclusive"){
    let pct = 0;
    DB.cart.forEach(i => { const p = prodById(i.productId); if (p) (p.charges || []).forEach(cid => { const ch = DB.productCharges.find(x => x.id === cid); if (ch) pct += Number(ch.value || 0); }); });
    taxes = Math.round(sub * pct / 100);
  }
  return { sub, disc, ship, addonTotal, taxes, total: Math.max(0, sub - disc) + ship + addonTotal + taxes };
}
function validateCouponFor(code, subtotal, mobile){
  const r = validateCoupon(code, subtotal);
  if (!r.ok) return r;
  const c = r.coupon;
  if (c.maxPerCustomer && mobile){
    const usedBy = DB.orders.filter(o => o.coupon === c.code && (o.customerMobile || "").replace(/\s/g, "") === mobile.replace(/\s/g, "")).length;
    if (usedBy >= Number(c.maxPerCustomer)) return { ok: false, msg: "Usage maximum par client atteint pour ce coupon (" + c.maxPerCustomer + ")." };
  }
  return r;
}

function ticketContact(t){
  return DB.contacts.find(c => (c.name && c.name === t.contact) || c.mobile === t.contact) || null;
}
function applyTicketFilter(){
  const body = document.getElementById("tf-body"); if (!body) return;
  const v = id => { const e = document.getElementById(id); return e ? e.value : ""; };
  const name = v("tf-name").toLowerCase(), email = v("tf-email").toLowerCase(), cc = v("tf-cc"), mob = v("tf-mobile").replace(/\s/g, "");
  const cp = presetOf("tf-created"), dp = presetOf("tf-due");
  const prio = v("tf-prio"), status = v("tf-status");
  const q = v("tf-q").toLowerCase();
  const rows = DB.tickets.filter(t => {
    const c = ticketContact(t);
    if (name && !(c && c.name.toLowerCase().includes(name))) return false;
    if (email && !(c && (c.email || "").toLowerCase().includes(email))) return false;
    if (cc && !(c && c.mobile.indexOf(cc) === 0)) return false;
    if (mob && !(c && c.mobile.replace(/\s/g, "").includes(mob))) return false;
    if (!inPreset(t.createdAt, cp.preset, cp.from, cp.to)) return false;
    if (!inPreset(t.due, dp.preset, dp.from, dp.to)) return false;
    if (q && !(t.subject.toLowerCase().includes(q) || (t.contact || "").toLowerCase().includes(q))) return false;
    if (prio && t.priority !== prio) return false;
    if (status && t.status !== status) return false;
    return true;
  });
  body.innerHTML = rows.length ? rows.map((t, i) => "<tr><td><input type=\"checkbox\" class=\"chk\"" + (ticketSel.has(t.id) ? " checked" : "") + " onchange=\"ticketToggle('" + t.id + "',this.checked)\"></td><td>" + (i + 1) + "</td><td>" + t.id + "</td><td>" + esc(t.priority) + "</td><td>" + esc(t.subject) + "</td><td>" + esc(t.contact) + "</td><td>" + statusBadge(t.status) + "</td><td>" + esc(t.due || "—") + "</td><td>" + esc(t.created) + '</td><td><button class="btn sm ghost" onclick="crmTicketForm(\'' + t.id + '\')">✏️</button> <button class="btn sm ghost" onclick="crmDelTicket(\'' + t.id + '\')">🗑️</button></td></tr>').join("")
    : '<tr><td colspan="10" class="empty">Ticket Not Found! — aucun ticket ne correspond à ces filtres.</td></tr>';
  const cnt = document.getElementById("tf-count");
  if (cnt) cnt.textContent = rows.length + " ticket(s) affiché(s) sur " + DB.tickets.length + (ticketSel.size ? " — " + ticketSel.size + " sélectionné(s)" : "");
}
function ticketToggle(id, on){ if (on) ticketSel.add(id); else ticketSel.delete(id); applyTicketFilter(); }
function ticketToggleAll(on){ if (on) DB.tickets.forEach(t => ticketSel.add(t.id)); else ticketSel.clear(); applyTicketFilter(); }
function ticketBulk(kind){
  if (!ticketSel.size) return toast("Sélectionnez d'abord des tickets (cases à cocher)");
  const val = document.getElementById(kind === "prio" ? "tb-prio" : "tb-status").value;
  DB.tickets.forEach(t => { if (ticketSel.has(t.id)){ if (kind === "prio") t.priority = val; else t.status = val; } });
  save(); toast(ticketSel.size + " ticket(s) mis à jour : " + (kind === "prio" ? "Priority" : "Status") + " → " + val + " ✓");
  applyTicketFilter();
}

/* ================= ROUTEUR ================= */
const content = () => $("#content");
function extractNav(route){
  const sc = $("#subcol"), sc2 = $("#subcol2"), c = content();
  sc.innerHTML = ""; sc2.innerHTML = "";
  const nav = c.querySelector(":scope > .subnav");
  if (nav){
    sc.appendChild(nav);
    const mod = currentModule(route);
    if (mod === "crm" || mod === "store"){
      const bh = document.createElement("div");
      bh.className = "bizhead";
      bh.innerHTML = '<span class="bav">V</span><span class="bn">' + esc(DB.business.name) + '</span><span class="sw">⇅</span>';
      sc.insertBefore(bh, sc.firstChild);
    }
  }
  const vt = c.querySelector(":scope > .vtabs");
  if (vt) sc2.appendChild(vt);
  sc.style.display = sc.children.length ? "" : "none";
  sc2.style.display = sc2.children.length ? "" : "none";
  sc.classList.toggle("insettings", /\/(settings|custom)\//.test(route));
  const ct = $("#content");
  const mod = currentModule(route);
  ct.classList.toggle("pale", mod === "home" || mod === "help");
}
function render(){
  const h = location.hash || "#/home";
  const parts = h.replace(/^#\//, "").split("/");
  renderShell(h);
  let html = "";
  const [mod, a, b] = parts;
  if (mod === "home" || h === "#/") html = viewHome();
  else if (mod === "crm"){
    if (a === "dashboard" || !a) html = viewCrmDashboard();
    else if (a === "tickets") html = viewCrmTickets();
    else if (a === "reminders") html = viewCrmReminders();
    else if (a === "contacts") html = viewCrmContacts();
    else if (a === "contact") html = viewCrmContact(b, parts[3]);
    else if (a === "groups") html = viewCrmGroups();
    else if (a === "broadcast") html = viewCrmBroadcast();
    else if (a === "templates") html = viewCrmTemplates();
    else if (a === "saved") html = viewCrmSaved(b);
    else if (a === "chats") html = viewCrmChats();
    else if (a === "polls") html = viewCrmPolls();
    else if (a === "extension") html = viewCrmExtension();
    else if (a === "settings") html = viewCrmSettings(b);
    else if (a === "exports") html = viewCrmExports();
  }
  else if (mod === "store"){
    if (a === "dashboard" || !a) html = viewStoreDashboard();
    else if (a === "orders") html = viewStoreOrders();
    else if (a === "order") html = viewStoreOrder(b, parts[3]);
    else if (a === "contacts") html = viewStoreContacts();
    else if (a === "reviews") html = viewStoreReviews();
    else if (a === "coupons") html = viewStoreCoupons();
    else if (a === "coupon") html = viewStoreCoupon(b);
    else if (a === "custom") html = viewStoreCustom(b);
    else if (a === "settings") html = viewStoreSettings(b);
    else if (a === "exports") html = viewStoreExports();
  }
  else if (mod === "catalog"){
    if (a === "products" || !a) html = viewCatalogProducts();
    else if (a === "product") html = viewCatalogProduct(b, parts[3]);
    else if (a === "categories") html = viewCatalogCategories();
    else if (a === "badges") html = viewCatalogBadges();
    else if (a === "attributes") html = viewCatalogAttributes();
    else if (a === "charges") html = viewCatalogCharges();
    else if (a === "inventory") html = viewCatalogInventory();
    else if (a === "integrations") html = viewCatalogIntegrations();
    else if (a === "seo") html = viewCatalogSeo();
  }
  else if (mod === "cards"){ const cd = DB.cards.find(x => x.id === b); html = a === "new" ? viewCardsNew() : (a === "view" && cd) ? viewCardDetail(cd) : viewCards(); }
  else if (mod === "shop"){
    if (a === "cart") html = viewShopCart();
    else if (a === "orders") html = viewShopOrders();
    else html = viewShop();
  }
  else if (mod === "help") html = viewHelp();
  else if (mod === "credits") html = viewCredits(a);
  else if (mod === "account") html = viewAccount(a);
  else html = viewHome();
  content().innerHTML = html;
  extractNav(h);
  closeSide();
  window.scrollTo(0, 0);
}
