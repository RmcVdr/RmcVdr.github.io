<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Boutique MLC — Magic Logistic Company</title>
<style>
:root{
  --navy:#0b1e3a; --navy2:#12294d; --blue:#2563eb; --blue-d:#1d4ed8; --cyan:#06b6d4;
  --bg:#f4f6fb; --card:#ffffff; --ink:#16233c; --mut:#64748b; --line:#e2e8f0;
  --green:#16a34a; --red:#dc2626; --orange:#f97316; --amber:#f59e0b; --violet:#7c3aed;
  --grad:linear-gradient(90deg,#2563eb,#7c3aed,#db2777);
  --r:14px; --sh:0 1px 3px rgba(11,30,58,.08),0 4px 14px rgba(11,30,58,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
a{color:var(--blue);text-decoration:none}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#c3cede;border-radius:4px}

/* ===== Shell ===== */
#app{display:flex;min-height:100vh}
#side{width:232px;background:var(--navy);color:#dbe6f7;position:fixed;top:0;bottom:0;left:0;z-index:60;display:flex;flex-direction:column;transition:transform .25s}
#side .brand{padding:16px 16px 10px;border-bottom:1px solid rgba(255,255,255,.09)}
#side .brand .logo{font-size:24px;font-weight:800;color:#fff;letter-spacing:-.5px}
#side .brand .logo i{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#side .brand .sub{font-size:11px;color:#8fa8c8;margin-top:2px}
#side nav{flex:1;overflow-y:auto;padding:10px 8px}
#side nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#c6d5ec;font-size:14px;margin-bottom:2px}
#side nav a:hover{background:rgba(255,255,255,.07);color:#fff}
#side nav a.on{background:var(--blue);color:#fff}
#side nav a .ic{width:20px;text-align:center;flex:none}
#side .ver{padding:10px 16px;font-size:11px;color:#7d94b5;border-top:1px solid rgba(255,255,255,.09)}
#main{flex:1;margin-left:232px;min-width:0;display:flex;flex-direction:column}
#top{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 16px}
#top .burger{display:none;background:none;border:0;font-size:21px;padding:4px 6px}
#top .biz{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font-weight:600;font-size:13.5px}
#top .sp{flex:1}
#top .hello{font-size:13.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
#content{padding:18px 16px 90px;max-width:1180px;width:100%;margin:0 auto}
#scrim{display:none;position:fixed;inset:0;background:rgba(5,12,25,.5);z-index:55}
#tabbar{display:none}

/* ===== Generic ===== */
h1{font-size:21px;font-weight:800;letter-spacing:-.3px}
h2{font-size:16.5px;font-weight:700}
h3{font-size:14.5px;font-weight:700}
.pagehead{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pagehead .sp{flex:1}
.pagehead p{color:var(--mut);font-size:13.5px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:1fr 1fr}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh)}
.stat .lb{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.stat .vl{font-size:20px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .vl small{font-size:12px;color:var(--mut);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:9px 15px;font-weight:600;font-size:14px}
.btn:hover{background:var(--blue-d)}
.btn.dark{background:var(--navy)} .btn.dark:hover{background:var(--navy2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)} .btn.ghost:hover{background:var(--bg)}
.btn.red{background:var(--red)} .btn.green{background:var(--green)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
th{text-align:left;padding:10px 12px;background:#f8fafc;color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #eef2f7;vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2.5px 8px;border-radius:20px;background:#e8eefc;color:var(--blue-d);white-space:nowrap}
.badge.green{background:#dcfce7;color:#15803d}.badge.red{background:#fee2e2;color:#b91c1c}
.badge.orange{background:#ffedd5;color:#c2410c}.badge.grey{background:#eef2f7;color:var(--mut)}
.badge.violet{background:#ede9fe;color:#6d28d9}
.dot{width:8px;height:8px;border-radius:50%;background:var(--orange);display:inline-block;flex:none}
.empty{padding:34px 16px;text-align:center;color:var(--mut)}
.empty .big{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:4px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.field label small{color:var(--mut);font-weight:400}
.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;font-size:14.5px}
.inp:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}
textarea.inp{min-height:74px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters .inp{width:auto;flex:1;min-width:120px}
.switch{position:relative;width:44px;height:24px;flex:none;display:inline-block;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.switch .tr{position:absolute;inset:0;background:#cbd5e1;border-radius:20px;transition:.2s}
.switch .tr:before{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.switch input:checked + .tr{background:var(--blue)}
.switch input:checked + .tr:before{transform:translateX(20px)}
.setrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #eef2f7}
.setrow:last-child{border-bottom:0}
.setrow .tx{flex:1;min-width:0}
.setrow .tx .t{font-weight:600;font-size:14.5px}
.setrow .tx .d{font-size:12.5px;color:var(--mut)}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subnav a{padding:7px 12px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--ink)}
.subnav a.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs a{padding:9px 13px;font-weight:600;font-size:14px;color:var(--mut);white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs a.on{color:var(--blue);border-color:var(--blue)}
.note{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.note.blue{background:#eff6ff;border-color:#bfdbfe;color:#1e40af}
.note.red{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #e8edf4;font-size:14px}
.kv:last-child{border-bottom:0}.kv b{font-variant-numeric:tabular-nums}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{background:var(--navy);border-radius:18px;color:#fff;padding:26px 20px;margin-bottom:16px}
.hero h1{font-size:24px;line-height:1.25}
.hero p{color:#b9cbe4;margin-top:8px;font-size:14.5px;max-width:640px}
.modcard{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);color:var(--ink)}
.modcard h3{font-size:17px;margin-bottom:6px}
.modcard ul{list-style:none;color:var(--mut);font-size:13.5px;margin-bottom:12px}
.modcard ul li{padding:2.5px 0}
.modcard .visit{color:var(--blue);font-weight:700;font-size:14px}
.check{color:var(--green);font-weight:800}.cross{color:var(--red);font-weight:800}
.mut{color:var(--mut)} .small{font-size:12.5px} .b{font-weight:700}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.strike{text-decoration:line-through;color:var(--mut);font-weight:400;font-size:.88em;margin-left:5px}
.pthumb{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none;color:#fff}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:92vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;z-index:150;display:none;align-items:flex-end;justify-content:center;background:rgba(5,12,25,.55)}
.modal.open{display:flex}
.modal .box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px 26px;position:relative}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:18px}}
.mhead{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
.mhead .sp{flex:1}
.mhead h2{padding-right:6px}
.xbtn{background:var(--bg);border:1px solid var(--line);width:32px;height:32px;border-radius:50%;font-size:15px;flex:none}
.earn{position:fixed;right:14px;bottom:86px;z-index:90;background:var(--grad);color:#fff;border:0;border-radius:24px;padding:11px 16px;font-weight:700;box-shadow:0 6px 20px rgba(124,58,237,.4);font-size:14px}

/* ===== Storefront ===== */
.shophead{background:var(--navy);color:#fff;border-radius:16px;padding:18px;margin-bottom:14px}
.shophead h1{font-size:22px}
.shophead p{color:#b9cbe4;font-size:13.5px;margin-top:3px}
.prod{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column}
.prod .ph{height:110px;display:flex;align-items:center;justify-content:center;font-size:52px;color:#fff}
.prod .pb{padding:11px 12px;flex:1;display:flex;flex-direction:column;gap:3px}
.prod .nm{font-weight:700;font-size:14.5px}
.prod .pr{margin-top:auto}
.wafloat{position:fixed;right:14px;bottom:150px;z-index:89;width:50px;height:50px;border-radius:50%;background:#25d366;color:#fff;border:0;font-size:24px;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.cartbar{position:sticky;bottom:74px;background:var(--navy);color:#fff;border-radius:12px;padding:11px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(11,30,58,.35);margin-top:12px;z-index:40}
.qty{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.qty button{width:30px;height:30px;border:0;background:var(--bg);font-size:16px;font-weight:700}
.qty span{min-width:30px;text-align:center;font-weight:700}

/* ===== Mobile ===== */
@media(max-width:820px){
  #side{transform:translateX(-105%)}
  #side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
  #scrim.show{display:block}
  #main{margin-left:0}
  #top .burger{display:block}
  #top .hello{display:none}
  #content{padding:14px 12px 96px}
  #tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:70;background:#fff;border-top:1px solid var(--line);padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
  #tabbar a{flex:1;text-align:center;font-size:10.5px;color:var(--mut);font-weight:600;padding:3px 0}
  #tabbar a .ic{display:block;font-size:19px;margin-bottom:1px}
  #tabbar a.on{color:var(--blue)}
  .earn{bottom:150px}
  .wafloat{bottom:212px}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <div id="scrim"></div>
  <div id="main">
    <header id="top"></header>
    <main id="content"></main>
  </div>
</div>
<nav id="tabbar"></nav>
<div class="modal" id="modal"><div class="box" id="modalbox"></div></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
/* =====================================================================
   Boutique MLC — miroir écran par écran de l'application auditée.
   Marque : Magic Logistic Company (MLC). Données : localStorage.
===================================================================== */
const LSKEY = "mlc_mirror_v1";
const $ = (s, el) => (el||document).querySelector(s);
const $$ = (s, el) => Array.from((el||document).querySelectorAll(s));
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => "FBu " + Number(n||0).toLocaleString("fr-FR");
const todayStr = () => new Date().toISOString().slice(0,10);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
function uid(p){ return p + Math.random().toString(36).slice(2,8); }

/* ---------------- Seed : données réelles du compte audité ---------------- */
function seed(){
  return {
    v: 1,
    owner: { name: "izere Armel", email: "izerenellya@gmail.com" },
    business: { id: "232707", name: "Vendor shop", country: "Burundi" },
    plan: "Free",
    credits: 0, creditHistory: [],
    settings: {
      storeName: "Vendor shop", about: "Shop online anytime anywhere",
      profileImg: "👟", coverImg: "", bizLanguage: "Automatic",
      address: "", country: "Burundi", currency: "FBu", weightUnit: "Metric",
      timezone: "Africa/Bujumbura", chargesMode: "Inclusive",
      whatsapp: "", lumicashNumber: "", enotiNumber: "",
      lumicashEnabled: true, enotiEnabled: true, payLaterEnabled: true,
      branding: true, themePrimary: "#2563eb", themeSecondary: "#06b6d4",
      productView: "List", displayFont: "Outfit", bodyFont: "Inter",
      domain: "", seoTitle: "", seoDesc: "", minOrderAmount: "", minOrderNote: "",
      checkoutNote: "", invoiceDue: "", receiptNotes: "",
      otpVerification: false, fasterCheckout: false
    },
    contacts: [
      { id: "12323261", salutation: "", name: "Vendor", mobile: "+257 79 000 001", email: "", company: "", gender: "", city: "", address: "", notes: "", funnel: "", tags: [], locked: false, created: "Il y a 2 ans" },
      { id: "12323262", salutation: "", name: "", mobile: "+257 79 000 002", email: "", company: "", gender: "", city: "", address: "", notes: "", funnel: "", tags: [], locked: false, created: "Il y a 2 ans" }
    ],
    products: [
      { id: "1238924", name: "Air Nike", type: "Variable", category: "Shoes", regular: 180000, selling: 150000, desc: "Pour les VVip", weight: 0, link: "", status: "Active", outOfStock: false, badges: ["Top Selling"], charges: [], seo: "", variants: [ { id: "v1", label: "Size Large", price: 150000, regular: 180000, sku: "", stock: 9, active: true } ] },
      { id: "1238925", name: "Jeans", type: "Variable", category: "Jeans", regular: 80000, selling: 65000, desc: "", weight: 0, link: "", status: "Active", outOfStock: false, badges: ["Top Selling"], charges: [], seo: "", variants: [ { id: "v2", label: "Size Large", price: 65000, regular: 80000, sku: "", stock: 9, active: true }, { id: "v3", label: "Size small", price: 65000, regular: 80000, sku: "", stock: 8, active: true } ] },
      { id: "1238926", name: "Luis Viton", type: "Variable", category: "Shirts", regular: 50000, selling: 45000, desc: "", weight: 0, link: "", status: "Active", outOfStock: true, badges: ["Top Selling"], charges: [], seo: "", variants: [ { id: "v4", label: "Size small", price: 45000, regular: 50000, sku: "", stock: 11, active: true } ] }
    ],
    categories: [
      { id: "c1", name: "chemises", status: "Active" }, { id: "c2", name: "Shirts", status: "Active" },
      { id: "c3", name: "Jeans", status: "Active" }, { id: "c4", name: "Shoes", status: "Active" }
    ],
    badgesList: [ { id: "b1", name: "Top Selling", color: "#f97316", status: "Active" } ],
    attributes: [ { id: "a1", name: "Size", kind: "Color-Palette" }, { id: "a2", name: "Size", kind: "Radio" } ],
    productCharges: [],
    orders: [
      { id: 1, num: 1, customerId: "12323262", customerName: "", customerMobile: "+257 79 000 002", placedBy: "User", status: "Open", payment: "Unpaid", paidVia: "Pay Later", payRef: "", shipTo: "", transactionId: "", adminNote: "", placed: "Il y a 2 ans", discount: 0, shipping: 0, taxes: 0, adjustment: 0, coupon: "",
        items: [ { productId: "1238924", name: "Air Nike", variant: "Size: Large", category: "Shoes", price: 150000, qty: 1 }, { productId: "1238925", name: "Jeans", variant: "Size: Large, Size: Yellow", category: "Jeans", price: 65000, qty: 1 } ],
        activity: [ "Order Created", "Payment mode updated Pay Later", "New item added Air Nike", "New item added Jeans", "Qty updated 0 → 1", "Qty updated 0 → 1" ] }
    ],
    nextOrder: 2,
    coupons: [
      { id: "4452", code: "VENDOR250", kind: "FBu", value: 10000, expiry: "2024-07-31", fromCart: 150000, maxDiscount: 20000, maxPerCustomer: "", maxUsage: "", tiers: "", details: "", visible: true, used: 0 }
    ],
    quickReplies: [ { id: "q1", title: "Vendor", text: "welcome to Vendor Shop", sent: 0, pinned: false } ],
    funnels: [], tagsList: [], tiers: [],
    ticketStatuses: [ { id: "ts1", name: "Open", color: "#16a34a" }, { id: "ts2", name: "Closed", color: "#dc2626" } ],
    tickets: [], reminders: [], polls: [], cards: [],
    banners: [ { id: "bn1", title: "Big Deal", img: "🛍️" } ],
    menus: [ { id: "m1", name: "Header Menu" }, { id: "m2", name: "Header Menu" } ],
    contactNumbers: [], links: [], socialLinks: [], pages: [],
    shippingLocations: [], shippingCharges: [], checkoutAddons: [], customFields: [],
    users: [ { id: "u1", name: "izere Armel", email: "izerenellya@gmail.com", role: "Admin", status: "Accepted", mobile: "" } ],
    cart: []
  };
}
let DB;
try { DB = JSON.parse(localStorage.getItem(LSKEY)) || seed(); } catch(e){ DB = seed(); }
if (!DB || !DB.v) DB = seed();
function save(){ localStorage.setItem(LSKEY, JSON.stringify(DB)); }
save();

/* ---------------- Helpers métier ---------------- */
const S = () => DB.settings;
const prodById = id => DB.products.find(p => p.id === id);
const contactById = id => DB.contacts.find(c => c.id === id);
const prodStock = p => p.variants.reduce((a, v) => a + Number(v.stock || 0), 0);
const prodDiscount = p => p.regular > 0 ? Math.floor((1 - p.selling / p.regular) * 100) : 0;
const orderSubtotal = o => o.items.reduce((a, i) => a + i.price * i.qty, 0);
const orderTotal = o => orderSubtotal(o) - Number(o.discount||0) + Number(o.shipping||0) + Number(o.taxes||0) + Number(o.adjustment||0);
const couponExpired = c => c.expiry && c.expiry < todayStr();
const CATCOLORS = { "Shoes": "#2563eb", "Jeans": "#7c3aed", "Shirts": "#db2777", "chemises": "#0891b2" };
const catColor = c => CATCOLORS[c] || "#0ea5e9";
const prodEmoji = p => ({ "Shoes": "👟", "Jeans": "👖", "Shirts": "👕", "chemises": "👔" })[p.category] || "🛍️";
function statusBadge(st){ const m = { "Open":"orange","Processing":"violet","Shipped":"violet","Delivered":"green","Returned":"grey","Closed":"grey","Cancelled":"red","Active":"green","Inactive":"grey" }; return '<span class="badge ' + (m[st]||"grey") + '">' + esc(st) + '</span>'; }
function payBadge(p){ return p === "Paid" ? '<span class="badge green">Paid</span>' : p === "Refund" ? '<span class="badge violet">Refund</span>' : '<span class="badge red">Unpaid</span>'; }
function receiptText(o){
  const L = ["Reçu — " + S().storeName, "Commande n°" + o.num, "--------------------------"];
  o.items.forEach(i => L.push(i.name + " (" + i.variant + ") — " + fmt(i.price) + " × " + i.qty + " = " + fmt(i.price * i.qty)));
  L.push("--------------------------", "Sous-total : " + fmt(orderSubtotal(o)), "Remise : " + fmt(o.discount||0), "Livraison : " + fmt(o.shipping||0), "Taxes : " + fmt(o.taxes||0), "Total : " + fmt(orderTotal(o)), "Paiement : " + o.payment + (o.paidVia ? " (" + o.paidVia + ")" : ""), "Statut : " + o.status);
  return L.join("\n");
}

function copyText(txt, msg){
  const done = () => toast(msg || "Copié ✓");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
  else fallbackCopy(txt, done);
}
function fallbackCopy(txt, done){ const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch(e){ toast("Copie impossible"); } ta.remove(); }
function downloadText(name, txt){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type: "text/plain" })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }

function viewStoreDashboard(){
  const os = DB.orders;
  const revenue = os.reduce((a, o) => a + orderTotal(o), 0);
  const collected = os.filter(o => o.payment === "Paid").reduce((a, o) => a + orderTotal(o), 0);
  const cnt = st => os.filter(o => o.status === st).length;
  const pay = p => os.filter(o => o.payment === p).length;
  const catRev = {}, prodRev = {}, custRev = {};
  os.forEach(o => o.items.forEach(i => { catRev[i.category] = (catRev[i.category] || 0) + i.price * i.qty; prodRev[i.name] = (prodRev[i.name] || 0) + i.price * i.qty; }));
  os.forEach(o => { const k = o.customerName || o.customerMobile; custRev[k] = (custRev[k] || 0) + orderTotal(o); });
  const rankList = obj => { const ks = Object.keys(obj); if (!ks.length) return '<div class="empty">No Data Found</div>'; return ks.sort((a, b) => obj[b] - obj[a]).map(k => '<div class="kv"><span>' + esc(k) + '</span><b>' + fmt(obj[k]) + "</b></div>").join(""); };
  const setupCard = (label, done, hash) => '<div class="card" style="margin:0;display:flex;gap:9px;align-items:center">' + (done ? '<span class="check">✔</span>' : '<span class="dot"></span>') + '<span style="flex:1"><b>' + label + '</b></span><a class="btn sm ghost" href="' + hash + '">Ouvrir</a></div>';
  return storeNav("dashboard") +
    pageHead("Store — Dashboard", "Votre boutique est en ligne : <b>boutique-mlc / " + esc(S().storeName.toLowerCase().replace(/\s+/g, "-")) + "</b> — « " + esc(S().about) + " »") +
    '<div class="grid g4">' +
      '<div class="stat"><div class="lb">Orders</div><div class="vl">' + os.length + "</div></div>" +
      '<div class="stat"><div class="lb">Revenue</div><div class="vl">' + fmt(revenue) + "</div></div>" +
      '<div class="stat"><div class="lb">Net Revenue (encaissé)</div><div class="vl">' + fmt(collected) + "</div></div>" +
      '<div class="stat"><div class="lb">À confirmer / impayé</div><div class="vl">' + fmt(revenue - collected) + "</div></div>" +
    "</div>" +
    '<div class="grid g2" style="margin-top:12px">' +
      '<div class="card" style="margin:0"><h3>Payment Status</h3><div class="kv"><span>Unpaid</span><b>' + pay("Unpaid") + '</b></div><div class="kv"><span>Paid</span><b>' + pay("Paid") + '</b></div><div class="kv"><span>Refund</span><b>' + pay("Refund") + "</b></div></div>" +
      '<div class="card" style="margin:0"><h3>Order Status</h3>' + ["Open", "Processing", "Shipped", "Delivered", "Returned", "Closed", "Cancelled"].map(st => '<div class="kv"><span>' + st + "</span><b>" + cnt(st) + "</b></div>").join("") + "</div>" +
    "</div>" +
    '<div class="grid g2" style="margin-top:12px">' +
      '<div class="card" style="margin:0"><h3>📊 Product Revenue</h3>' + rankList(prodRev) + '</div>' +
      '<div class="card" style="margin:0"><h3>📊 Category Revenue</h3>' + rankList(catRev) + "</div>" +
    "</div>" +
    '<div class="grid g2" style="margin-top:12px">' +
      '<div class="card" style="margin:0"><h3>🏆 Top Products</h3>' + rankList(prodRev) + '</div>' +
      '<div class="card" style="margin:0"><h3>🏆 Top Customers</h3>' + rankList(custRev) + "</div>" +
    "</div>" +
    '<h2 style="margin:14px 0 10px">Configuration de la boutique</h2><div class="grid g2">' +
      setupCard("Add WhatsApp No.", !!S().whatsapp, "#/store/custom/numbers") +
      setupCard("Upload Cover Photo", !!S().coverImg, "#/store/custom/about") +
      setupCard("Add Social Links", DB.socialLinks.length > 0, "#/store/custom/social") +

}

function validateCoupon(code, subtotal){
  const c = DB.coupons.find(x => x.code === String(code || "").trim().toUpperCase());
  if (!c) return { ok: false, msg: "Coupon introuvable." };
  if (couponExpired(c)) return { ok: false, msg: "Ce coupon a expiré le " + c.expiry.split("-").reverse().join("/") + "." };
  if (subtotal < Number(c.fromCart || 0)) return { ok: false, msg: "Ce coupon exige un panier d'au moins " + fmt(c.fromCart) + "." };
  let d = c.kind === "%" ? Math.round(subtotal * c.value / 100) : Number(c.value);
  if (c.maxDiscount) d = Math.min(d, Number(c.maxDiscount));
  return { ok: true, coupon: c, discount: d, msg: "Coupon appliqué : −" + fmt(d) };
}

  return '<div style="text-align:center;margin-bottom:14px"><h1>Pricing — Start with Free Trial</h1><p class="mut">Sélectionnez l\'offre qui convient le mieux à votre entreprise.</p>' +
    '<div style="margin-top:8px"><span class="badge">Capterra review</span> <span class="badge orange">AppSumo review</span> <span class="badge green">Trustpilot review</span></div></div>' +

    '<div style="text-align:center;margin-bottom:14px"><label class="switch"><input type="checkbox" id="pl-period" ' + (planState.period === "annual" ? "checked" : "") + ' onchange="setPlanPeriod(this.checked)"><span class="tr"></span></label> <b>' + (planState.period === "annual" ? "Yearly" : "Monthly") + '</b> <span class="badge green">Save 16%</span><div class="small mut" style="margin-top:4px">*All prices are exclusive of taxes.</div></div>' +
    '<div class="grid g2">' +
      '<div class="card" style="margin:0;text-align:center"><h3>Free (Trial)</h3><p class="mut small">For Business Starters</p><div style="font-size:28px;font-weight:800;margin:8px 0">$0.00</div><span class="badge">Explorer — Forever Free Plan</span><div style="margin-top:6px"><span class="badge green">Your Plan</span></div><button class="btn ghost" style="margin-top:12px" disabled>Try Now</button></div>' +
      '<div class="card" style="margin:0;text-align:center;border-color:var(--blue)"><h3>Premium</h3><p class="mut small">For Established Businesses</p><div style="font-size:28px;font-weight:800;margin:8px 0">$' + (planState.period === "annual" ? pr.annual : pr.monthly) + '.00<small class="mut" style="font-size:13px"> /month</small></div>' + (planState.period === "annual" ? '<p class="mut small">Billed Annually — $' + pr.annualTotal + "</p>" : '<p class="mut small">Billed monthly</p>') + '<button class="btn" style="margin-top:12px" onclick="toast(\'Upgrade : paiement à brancher\')">Try Now</button></div>' +
    "</div>" +
    '<div class="card" style="margin-top:12px"><h3>Compare Plans</h3><div class="tblwrap" style="box-shadow:none;border:0"><table style="min-width:420px"><tr><th>Fonctionnalité</th><th>FREE — $0.00/month</th><th>PREMIUM — $' + (planState.period === "annual" ? pr.annual : pr.monthly) + '.00/month</th></tr>' +
    rows.map(r => "<tr><td>" + r[0] + "</td><td>" + planCell(r[1]) + "</td><td>" + planCell(r[2]) + "</td></tr>").join("") + "</table></div></div>" +
    '<div class="grid g2"><div class="card" style="margin:0"><h3>Large Scale Enterprise</h3><p class="mut" style="margin-top:6px">Vous cherchez une solution sur mesure ? Nous appliquons plus d\'une décennie d\'expérience pour vous aider à atteindre vos objectifs.</p><button class="btn ghost" style="margin-top:10px" onclick="toast(\'Contact : support MLC\')">Contact Us</button></div>' +
    '<div class="card" style="margin:0"><h3>Early Stage Startups and NGOs</h3><p class="mut" style="margin-top:6px">Discutons : nous évaluerons votre modèle et comment MLC peut vous aider à grandir.</p><button class="btn ghost" style="margin-top:10px" onclick="toast(\'Contact : support MLC\')">Contact Us</button></div></div>' +
    '<p class="small mut" style="margin-top:10px">For Starters, try our Free Plan. — No strings attached. You can upgrade, downgrade or cancel anytime.</p>';
}
function setPlanPack(p){ planState.pack = p; render(); }
function setPlanPeriod(annual){ planState.period = annual ? "annual" : "monthly"; render(); }
/* ================= VITRINE PUBLIQUE ================= */
let shopState = { q: "", cat: "Tous les articles", couponMsg: "", couponDiscount: 0, couponCode: "" };
function cartCount(){ return DB.cart.reduce((a, i) => a + i.qty, 0); }
function cartSubtotal(){ return DB.cart.reduce((a, i) => a + i.price * i.qty, 0); }
function shopNav(active){
  const items = [ ["home","Accueil"], ["cart","Chariot (" + cartCount() + ")"], ["orders","Mes commandes"] ];
  return '<div class="subnav">' + items.map(i => '<a href="#/shop' + (i[0] === "home" ? "" : "/" + i[0]) + '" class="' + (active === i[0] ? "on" : "") + '">' + i[1] + "</a>").join("") + ' <span style="flex:1"></span><select class="inp" style="width:auto" onchange="toast(\'Langue de la vitrine : Français\')"><option>Français</option><option>English</option></select></div>';
}
function prodCard(p){
  const d = prodDiscount(p);
  return '<div class="prod"><div class="ph" style="background:' + catColor(p.category) + '">' + prodEmoji(p) + '</div><div class="pb">' +
    (p.badges.length ? '<span class="badge orange" style="align-self:flex-start">' + esc(p.badges[0]) + "</span>" : "") +
    '<span class="nm">' + esc(p.name) + "</span>" +
    '<span class="small mut">' + esc(p.category) + " · Stock " + prodStock(p) + "</span>" +
    '<div class="pr"><span class="money">' + (p.variants.length > 1 ? "À partir de " : "") + fmt(p.selling) + '</span><span class="strike">' + fmt(p.regular) + "</span>" + (d ? ' <span class="badge red">−' + d + " %</span>" : "") + "</div>" +
    '<button class="btn sm" style="margin-top:8px" onclick="shopOpenProduct(\'' + p.id + '\')">Voir / Ajouter au panier</button>' +
    "</div></div>";
}
function viewShop(){
  const cats = ["Tous les articles"].concat(DB.categories.map(c => c.name));
  let list = DB.products.filter(p => p.status === "Active");
  if (shopState.cat !== "Tous les articles") list = list.filter(p => p.category === shopState.cat);
  if (shopState.q) list = list.filter(p => p.name.toLowerCase().includes(shopState.q.toLowerCase()));
  return shopNav("home") +
    '<div class="shophead"><span class="badge orange">' + esc(DB.banners.length ? DB.banners[0].title : "Big Deal") + '</span><h1 style="margin-top:8px">' + esc(S().storeName) + "</h1><p>" + esc(S().about) + "</p></div>" +
    '<div class="filters"><input class="inp" placeholder="Rechercher des articles" value="' + esc(shopState.q) + '" oninput="shopSearch(this.value)"><select class="inp" onchange="shopSort(this.value)"><option>Recommandé</option><option>Prix croissant</option><option>Prix décroissant</option></select><select class="inp" onchange="shopView(this.value)"><option' + (S().productView === "List" ? " selected" : "") + '>Vue liste</option><option' + (S().productView === "Grid" ? " selected" : "") + ">Vue grille</option><option" + (S().productView === "Compact" ? " selected" : "") + ">Vue compacte</option></select></div>" +
    '<div class="subnav">' + cats.map(c => '<a href="javascript:void(0)" onclick="shopCat(\'' + esc(c) + '\')" class="' + (shopState.cat === c ? "on" : "") + '">' + esc(c) + "</a>").join("") + "</div>" +
    (list.length ? '<div class="grid ' + (S().productView === "Grid" ? "g3" : "g2") + '">' + list.map(prodCard).join("") + "</div>" : '<div class="card empty"><div class="big">Aucun article</div>— C\'est tout —</div>') +
    '<p class="small mut" style="text-align:center;margin-top:14px">— C\'est tout —</p>' +
    (cartCount() ? '<div class="cartbar"><span>🛒 ' + cartCount() + ' article(s) — <b>' + fmt(cartSubtotal()) + '</b></span><span style="flex:1"></span><a class="btn" href="#/shop/cart">Voir le chariot</a></div>' : "") +
    '<div class="card" style="margin-top:14px;text-align:center"><b>' + esc(S().storeName) + "</b> — " + esc(S().about) + '<br><span class="small mut">' + (S().branding ? "Propulsé par MLC — Magic Logistic Company" : "") + "</span></div>" +
    '<button class="wafloat" onclick="shopWhatsApp()" title="WhatsApp">💬</button>';
}
function shopSearch(v){ shopState.q = v; clearTimeout(window._sq); window._sq = setTimeout(render, 220); }
function shopSort(v){ if (v === "Prix croissant") DB.products.sort((a, b) => a.selling - b.selling); else if (v === "Prix décroissant") DB.products.sort((a, b) => b.selling - a.selling); render(); }
function shopView(v){ S().productView = v.replace("Vue ", "").replace("liste", "List").replace("grille", "Grid").replace("compacte", "Compact"); save(); render(); }
function shopCat(c){ shopState.cat = c; render(); }
function shopWhatsApp(){ const num = (S().whatsapp || "").replace(/[^0-9]/g, ""); if (num) window.open("https://wa.me/" + num, "_blank"); else toast("Numéro WhatsApp de la boutique non renseigné (Gestion → Réglages)"); }
function shopOpenProduct(pid){
  const p = prodById(pid); if (!p) return;
  const d = prodDiscount(p);
  openModal('<div class="mhead"><div class="sp"><h2>' + esc(p.name) + '</h2></div><button class="xbtn" onclick="closeModal()">✕</button></div>' +
    '<div class="ph" style="height:130px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:60px;background:' + catColor(p.category) + '">' + prodEmoji(p) + "</div>" +
    '<div style="margin-top:12px">' + (p.badges.length ? '<span class="badge orange">' + esc(p.badges[0]) + "</span> " : "") + '<span class="badge">' + esc(p.category) + "</span></div>" +
    '<div style="margin-top:8px"><span class="money" style="font-size:19px">' + fmt(p.selling) + '</span><span class="strike">' + fmt(p.regular) + "</span>" + (d ? ' <span class="badge red">' + d + " % DE RÉDUCTION</span>" : "") + "</div>" +
    (p.desc ? '<p class="mut" style="margin-top:8px">' + esc(p.desc) + "</p>" : "") +
    '<div class="field" style="margin-top:12px"><label>Variante</label><select class="inp" id="sp-variant">' + p.variants.map(v => '<option value="' + v.id + '">' + esc(v.label) + " — " + fmt(v.price) + " (stock " + v.stock + ")</option>").join("") + "</select></div>" +
    '<div class="field"><label>Quantité</label><input class="inp" type="number" id="sp-qty" value="1" min="1"></div>' +
    '<button class="btn" style="width:100%;justify-content:center" onclick="shopAddToCart(\'' + pid + '\')">Ajouter au panier</button>');
}
function shopAddToCart(pid){
  const p = prodById(pid); const v = p.variants.find(x => x.id === $("#sp-variant").value) || p.variants[0];
  const q = Math.max(1, Number($("#sp-qty").value || 1));
  const ex = DB.cart.find(i => i.productId === pid && i.variantId === v.id);
  if (ex) ex.qty += q; else DB.cart.push({ productId: pid, variantId: v.id, name: p.name, variant: v.label, category: p.category, price: v.price, qty: q });
  save(); closeModal(); toast("Ajouté au panier ✓"); render();
}
function viewShopCart(){
  if (!DB.cart.length) return shopNav("cart") + '<div class="card empty"><div class="big">Votre chariot est vide</div><a class="btn" href="#/shop">Voir les articles</a></div>';
  const sub = cartSubtotal();
  const disc = shopState.couponDiscount || 0;
  return shopNav("cart") + pageHead("Chariot") +
    '<div class="card">' + DB.cart.map((i, ix) => '<div class="setrow"><span class="pthumb" style="background:' + catColor(i.category) + '">' + prodEmoji(prodById(i.productId) || { category: i.category }) + '</span><div class="tx"><div class="t">' + esc(i.name) + '</div><div class="d">' + esc(i.variant) + " · " + fmt(i.price) + '</div></div><span class="qty"><button onclick="cartQty(' + ix + ',-1)">−</button><span>' + i.qty + '</span><button onclick="cartQty(' + ix + ',1)">+</button></span><b class="money">' + fmt(i.price * i.qty) + '</b><button class="xbtn" onclick="cartRemove(' + ix + ')">🗑️</button></div>').join("") +
    '<div class="field" style="margin-top:14px"><label>Coupon</label><div style="display:flex;gap:8px"><input class="inp" id="cart-coupon" placeholder="Code coupon" value="' + esc(shopState.couponCode) + '"><button class="btn ghost" onclick="cartApplyCoupon()">Appliquer</button></div>' + (shopState.couponMsg ? '<p class="small" style="margin-top:6px;color:' + (disc ? "var(--green)" : "var(--red)") + '">' + esc(shopState.couponMsg) + "</p>" : "") + "</div>" +
    '<div class="kv"><span>Sous-total</span><b>' + fmt(sub) + '</b></div>' + (disc ? '<div class="kv"><span>Remise coupon</span><b>−' + fmt(disc) + "</b></div>" : "") + '<div class="kv"><span>Total</span><b>' + fmt(sub - disc) + "</b></div></div>" +
    '<div class="card"><h3>Commander</h3>' +
    '<div class="field" style="margin-top:10px"><label>Name</label><input class="inp" id="co-name"></div>' +
    '<div class="field"><label>Mobile Number</label><input class="inp" id="co-mobile" placeholder="+257 …"></div>' +
    '<div class="field"><label>Email</label><input class="inp" id="co-email"></div>' +
    '<div class="field"><label>Address Line 1</label><input class="inp" id="co-addr"></div>' +
    '<div class="row"><div class="field"><label>City</label><input class="inp" id="co-city"></div><div class="field"><label>Country</label><input class="inp" id="co-country" value="Burundi"></div></div>' +
    '<div class="field"><label>Note</label><input class="inp" id="co-note"></div>' +
    (S().checkoutNote ? '<div class="note">' + esc(S().checkoutNote) + "</div>" : "") +
    '<div class="field"><label>Mode de paiement</label><select class="inp" id="co-pay" onchange="shopPayInfo()">' +
      (S().lumicashEnabled ? '<option value="Lumicash">Lumicash</option>' : "") + (S().enotiEnabled ? '<option value="eNoti">eNoti</option>' : "") + (S().payLaterEnabled ? '<option value="Pay Later">Payer plus tard (Pay Later)</option>' : "") + "</select></div>" +
    '<div id="payinfo"></div>' +
    '<div class="field" id="payref-field"><label>Référence de la transaction</label><input class="inp" id="co-ref" placeholder="Référence reçue après le paiement"></div>' +
    '<button class="btn" style="width:100%;justify-content:center" onclick="shopPlaceOrder()">Place Order — Commander</button></div>' +
    "<script>setTimeout(shopPayInfo,50)<\/script>";
}
function shopPayInfo(){
  const mode = ($("#co-pay") || {}).value; if (!mode) return;
  const total = cartSubtotal() - (shopState.couponDiscount || 0);
  const num = mode === "Lumicash" ? S().lumicashNumber : mode === "eNoti" ? S().enotiNumber : "";
  const refField = $("#payref-field");
  if (mode === "Pay Later"){ $("#payinfo").innerHTML = '<div class="note">Paiement manuel plus tard : la boutique vous contactera pour le règlement.</div>'; if (refField) refField.style.display = "none"; }
  else { $("#payinfo").innerHTML = '<div class="note blue">📲 Payez <b>' + fmt(total) + '</b> par <b>' + mode + '</b> au numéro marchand : <b>' + esc(num || "à renseigner par la boutique") + '</b>, puis saisissez la référence de la transaction ci-dessous. La boutique confirmera la réception.</div>'; if (refField) refField.style.display = ""; }
}
function cartQty(ix, d){ DB.cart[ix].qty += d; if (DB.cart[ix].qty <= 0) DB.cart.splice(ix, 1); save(); render(); }
function cartRemove(ix){ DB.cart.splice(ix, 1); save(); render(); }
function cartApplyCoupon(){ const r = validateCoupon($("#cart-coupon").value, cartSubtotal()); shopState.couponCode = $("#cart-coupon").value; shopState.couponMsg = r.msg; shopState.couponDiscount = r.ok ? r.discount : 0; if (r.ok) shopState.couponObj = r.coupon.code; render(); }
function shopPlaceOrder(){
  const name = $("#co-name").value.trim(), mobile = $("#co-mobile").value.trim();
  if (!name || !mobile) return toast("Nom et numéro de mobile requis");
  const mode = $("#co-pay").value; const ref = ($("#co-ref") || {}).value || "";
  if (mode !== "Pay Later" && !ref) return toast("Saisissez la référence de la transaction " + mode);
  const sub = cartSubtotal(); const disc = shopState.couponDiscount || 0;
  const shipTo = [$("#co-addr").value, $("#co-city").value, $("#co-country").value].filter(Boolean).join(", ");
  const o = { id: DB.nextOrder, num: DB.nextOrder, customerId: "", customerName: name, customerMobile: mobile, placedBy: "User", status: "Open", payment: "Unpaid", paidVia: mode, payRef: ref, shipTo, transactionId: ref, adminNote: "", placed: "Aujourd'hui", discount: disc, shipping: 0, taxes: 0, adjustment: 0, coupon: shopState.couponObj || "",
    items: DB.cart.map(i => ({ productId: i.productId, name: i.name, variant: i.variant, category: i.category, price: i.price, qty: i.qty })),
    activity: ["Order Created", "Payment mode " + mode + (ref ? " — réf. " + ref : "")] };
  DB.cart.forEach(i => { const p = prodById(i.productId); if (p) { const v = p.variants.find(x => x.id === i.variantId); if (v) v.stock = Math.max(0, v.stock - i.qty); } });
  if (shopState.couponObj){ const cp = DB.coupons.find(c => c.code === shopState.couponObj); if (cp) cp.used++; }
  DB.nextOrder++; DB.orders.push(o);
  let cust = DB.contacts.find(c => c.mobile === mobile); if (!cust) { cust = { id: uid("12"), salutation: "", name, mobile, email: $("#co-email").value, company: "", gender: "", city: $("#co-city").value, address: $("#co-addr").value, notes: "", funnel: "", tags: [], locked: false, created: "Aujourd'hui" }; DB.contacts.push(cust); }
  o.customerId = cust.id;
  DB.cart = []; shopState.couponDiscount = 0; shopState.couponMsg = ""; shopState.couponCode = ""; shopState.couponObj = "";
  save();
  openModal(modalHead("Commande confirmée 🎉") + '<p>Votre commande <b>n°' + o.num + '</b> est créée — statut : <b>Open</b>, paiement : <b>' + (mode === "Pay Later" ? "à régler plus tard" : "en attente de confirmation par la boutique") + '</b>.</p><div class="card" style="margin-top:12px;white-space:pre-wrap;font-size:13.5px">' + esc(receiptText(o)) + '</div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="copyText(receiptText(DB.orders.find(x=>x.id===' + o.id + ')),\'Reçu copié ✓\')">Copier le reçu</button><button class="btn green" onclick="shopSendReceiptWA(' + o.id + ')">Envoyer sur WhatsApp</button><button class="btn ghost" onclick="closeModal();location.hash=\'#/shop/orders\'">Voir mes commandes</button></div>');
  render();
}
function shopSendReceiptWA(id){ const o = DB.orders.find(x => x.id === id); const num = (S().whatsapp || "").replace(/[^0-9]/g, ""); const txt = encodeURIComponent(receiptText(o)); window.open("https://wa.me/" + num + "?text=" + txt, "_blank"); }
function viewShopOrders(){
  return shopNav("orders") + pageHead("Mes commandes", "Retrouvez vos commandes avec votre numéro de mobile.") +
    '<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap"><input class="inp" id="so-mobile" placeholder="+257 …" style="flex:1;min-width:160px"><button class="btn" onclick="shopFindOrders()">Se connecter / Rechercher</button></div><div id="so-results" style="margin-top:12px"></div></div>' +
    '<p class="small mut">La connexion du client pour voir ses commandes passées utilise les crédits WhatsApp de la boutique (voir Credits).</p>';
}
function shopFindOrders(){
  const m = $("#so-mobile").value.trim(); if (!m) return toast("Numéro requis");
  const list = DB.orders.filter(o => o.customerMobile.replace(/\s/g, "").includes(m.replace(/\s/g, "")) || m.replace(/\s/g, "").includes(o.customerMobile.replace(/\s/g, "")));
  $("#so-results").innerHTML = list.length ? list.map(o => '<div class="kv"><span><b>Commande n°' + o.num + "</b> — " + esc(o.placed) + "<br><span class='small mut'>" + o.items.map(i => esc(i.name) + " ×" + i.qty).join(", ") + '</span></span><span style="text-align:right">' + fmt(orderTotal(o)) + "<br>" + statusBadge(o.status) + " " + payBadge(o.payment) + "</span></div>").join("") : '<div class="empty">Aucune commande pour ce numéro.</div>';
}

/* ================= ROUTEUR ================= */
const content = () => $("#content");
function render(){
  const h = location.hash || "#/home";
  const parts = h.replace(/^#\//, "").split("/");
  renderShell(h);
  let html = "";
  const [mod, a, b] = parts;
  if (mod === "home" || h === "#/") html = viewHome();
  else if (mod === "crm"){
    if (a === "dashboard" || !a) html = viewCrmDashboard();
    else if (a === "tickets") html = viewCrmTickets();
    else if (a === "reminders") html = viewCrmReminders();
    else if (a === "contacts") html = viewCrmContacts();
    else if (a === "contact") html = viewCrmContact(b, parts[3]);
    else if (a === "groups") html = viewCrmGroups();
    else if (a === "broadcast") html = viewCrmBroadcast();
    else if (a === "templates") html = viewCrmTemplates();
    else if (a === "saved") html = viewCrmSaved(b);
    else if (a === "chats") html = viewCrmChats();
    else if (a === "polls") html = viewCrmPolls();
    else if (a === "extension") html = viewCrmExtension();
    else if (a === "settings") html = viewCrmSettings(b);
    else if (a === "exports") html = viewCrmExports();
  }
  else if (mod === "store"){
    if (a === "dashboard" || !a) html = viewStoreDashboard();
    else if (a === "orders") html = viewStoreOrders();
    else if (a === "order") html = viewStoreOrder(b, parts[3]);
    else if (a === "contacts") html = viewStoreContacts();
    else if (a === "reviews") html = viewStoreReviews();
    else if (a === "coupons") html = viewStoreCoupons();
    else if (a === "coupon") html = viewStoreCoupon(b);
    else if (a === "custom") html = viewStoreCustom(b);
    else if (a === "settings") html = viewStoreSettings(b);
    else if (a === "exports") html = viewStoreExports();
  }
  else if (mod === "catalog"){
    if (a === "products" || !a) html = viewCatalogProducts();
    else if (a === "product") html = viewCatalogProduct(b, parts[3]);
    else if (a === "categories") html = viewCatalogCategories();
    else if (a === "badges") html = viewCatalogBadges();
    else if (a === "attributes") html = viewCatalogAttributes();
    else if (a === "charges") html = viewCatalogCharges();
    else if (a === "inventory") html = viewCatalogInventory();
    else if (a === "integrations") html = viewCatalogIntegrations();
    else if (a === "seo") html = viewCatalogSeo();
  }
  else if (mod === "cards"){ html = a === "new" ? viewCardsNew() : viewCards(); }
  else if (mod === "shop"){
    if (a === "cart") html = viewShopCart();
    else if (a === "orders") html = viewShopOrders();
    else html = viewShop();
  }
  else if (mod === "help") html = viewHelp();
  else if (mod === "credits") html = viewCredits();
  else if (mod === "account") html = viewAccount(a);
  else html = viewHome();
  content().innerHTML = html;
  if (mod === "shop" && a === "cart") setTimeout(shopPayInfo, 30);
  closeSide();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
render();
</script>
