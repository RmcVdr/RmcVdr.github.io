<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>MLC — Vendor shop</title>
<style>

:root{
  --bg:#F3F6FF; --navy:#17264A; --navy2:#1B2B52; --muted:#8494B3; --muted2:#93A3C0;
  --blue:#2E5BFF; --pill:#E3EBFF; --line:#E4EAF6; --marine:#18274F;
  --grad1:#203489; --grad2:#192959; --orange-bg:#FFF1E2; --orange-tx:#DE7A12;
  --green-bg:#DCFCE7; --green-tx:#2F9E6E; --grey-bg:#EEF1F6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#DFE6F5;color:var(--navy)}
#phone{max-width:430px;margin:0 auto;background:var(--bg);min-height:100dvh;position:relative;box-shadow:0 0 32px rgba(23,38,74,.18);display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding-bottom:96px}
main.nonav{padding-bottom:24px}
h1.title{font-size:21px;font-weight:800;color:var(--navy)}
.sec-title{font-size:17px;font-weight:800;color:var(--navy);margin:22px 0 12px}
/* ---------- en-tête store ---------- */
.store-head{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 10px;background:var(--bg)}
.logo{display:flex;align-items:center;gap:7px}
.logo .word{font-size:26px;font-weight:800;color:var(--navy2);letter-spacing:-.5px}
.logo .chev{color:var(--navy2);margin-top:4px}
.profile-dot{width:44px;height:44px;border-radius:50%;background:#DCE7FF;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer}
/* ---------- Maison ---------- */
.banner{margin:6px 0 0;background:linear-gradient(100deg,var(--grad1) 20%,var(--grad2) 90%);padding:22px 20px 44px;display:flex;gap:16px;align-items:center}
.banner img{width:94px;height:94px;object-fit:cover;border-radius:14px;flex:none}
.banner .shop{color:#fff;font-size:23px;font-weight:800;line-height:1.15}
.banner .url{color:#D7DFFB;font-size:11.8px;margin-top:5px;white-space:nowrap}
.visitbar{margin:-26px 16px 0;background:var(--marine);border-radius:18px;display:flex;overflow:hidden;box-shadow:0 8px 20px rgba(24,39,79,.25)}
.visitbar button{flex:1;background:none;border:none;color:#fff;font-size:16.5px;font-weight:700;padding:19px 0;cursor:pointer}
.visitbar .sep{width:1px;background:rgba(255,255,255,.45);margin:12px 0}
.wrap{padding:0 16px}
.stat-card{background:#fff;border-radius:16px;padding:19px 20px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.stat-card .lab{font-size:17px;color:var(--navy)}
.stat-card .val{font-size:20px;font-weight:800;color:var(--navy)}
.stat-card .val.big{font-size:23px}
.profil-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.profil-row::-webkit-scrollbar{display:none}
.profil-row img{height:118px;width:auto;border-radius:16px;flex:none}
.profil-row img.partial{width:88px;object-fit:cover;object-position:left}
/* ---------- navigation basse ---------- */
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 14px rgba(23,38,74,.06);z-index:40}
#tabbar button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:2px 0 0}
#tabbar .ic{width:52px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center}
#tabbar button.on .ic{background:var(--pill)}
#tabbar .lb{font-size:12.5px;color:var(--navy);font-weight:600}
#tabbar button.on .lb{color:var(--blue);font-weight:700}
/* ---------- Catalogue ---------- */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cat-tile{background:#fff;border-radius:20px;padding:10px 10px 14px;cursor:pointer;border:none;text-align:left;width:100%}
.cat-tile img{width:100%;aspect-ratio:1.45;object-fit:cover;border-radius:14px;display:block}
.cat-tile .row{display:flex;align-items:center;justify-content:space-between;padding:12px 6px 0}
.cat-tile .lb{font-size:16.5px;font-weight:800;color:var(--navy)}
/* ---------- Ordres ---------- */
.page-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 6px}
.page-head .icons{display:flex;gap:20px;align-items:center}
.order-card{background:#fff;border-radius:22px;padding:18px;margin:10px 16px 0;cursor:pointer}
.order-card .r1{display:flex;align-items:center;gap:14px}
.avatar{width:56px;height:56px;border-radius:50%;background:#EEF3FF;display:flex;align-items:center;justify-content:center;flex:none}
.order-card .phone{font-size:18.5px;font-weight:800;color:var(--navy)}
.order-card .num{margin-left:auto;font-size:15px;font-weight:700;color:#5A6B8C}
.order-card hr{border:none;border-top:1px solid var(--line);margin:15px 0 13px}
.order-card .r2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.order-card .k{font-size:13.5px;color:var(--muted2);margin-bottom:6px}
.order-card .v{font-size:16px;font-weight:800;color:var(--navy)}
.pill-open{display:inline-block;background:var(--orange-bg);color:var(--orange-tx);border:1px solid #F3D3AC;font-size:14px;font-weight:700;border-radius:999px;padding:3px 13px}
.pill-paid{display:inline-block;background:var(--green-bg);color:var(--green-tx);font-size:14px;font-weight:700;border-radius:999px;padding:3px 13px}
/* ---------- Plus ---------- */
.searchbar{margin:8px 16px 4px;background:#fff;border-radius:14px;display:flex;align-items:center;gap:10px;padding:15px 16px;color:#7A879E;font-size:16px}
.plus-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:0 16px}
.plus-tile{background:#fff;border-radius:20px;padding:20px 6px 16px;display:flex;flex-direction:column;align-items:center;gap:11px;cursor:pointer;border:none;width:100%}
.plus-tile .lb{font-size:14.5px;font-weight:700;color:var(--navy);text-align:center;line-height:1.25}
/* ---------- Compte & sous-écrans ---------- */
.sub-head{display:flex;align-items:center;gap:14px;background:#fff;padding:16px 20px 14px;position:sticky;top:0;z-index:5}
.sub-head .back{background:none;border:none;cursor:pointer;display:flex;padding:2px}
.sub-head .t{font-size:20px;font-weight:800;color:var(--navy)}
.id-card{background:#fff;border-radius:20px;padding:20px;margin:16px 16px 0;display:flex;align-items:center;gap:16px}
.id-ava{width:74px;height:74px;border-radius:50%;background:#F2F7FF;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--navy);flex:none}
.id-card .nm{font-size:19px;font-weight:800;color:var(--navy)}
.id-card .em{font-size:14.5px;color:#5A6B8C;margin-top:3px}
.id-card .mod{margin-left:auto;color:var(--blue);font-size:16px;font-weight:600;background:none;border:none;cursor:pointer}
.list-card{background:#fff;border-radius:20px;margin:16px 16px 0;padding:6px 20px}
.list-row{display:flex;align-items:center;gap:16px;padding:17px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-top:none;border-left:none;border-right:none;width:100%;text-align:left}
.list-row:last-child{border-bottom:none}
.list-row .ic{width:46px;height:46px;border-radius:13px;background:#EEF2FB;display:flex;align-items:center;justify-content:center;flex:none}
.list-row .lb{font-size:16.5px;font-weight:700;color:var(--navy)}
.list-row .chev{margin-left:auto;color:var(--muted)}
/* ---------- cartes génériques ---------- */
.card{background:#fff;border-radius:18px;padding:18px 20px;margin:12px 16px 0}
.card .row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:15.5px}
.card .row .k{color:#5A6B8C}
.card .row .v{font-weight:700;color:var(--navy);text-align:right}
.card h3{font-size:16.5px;font-weight:800;color:var(--navy);margin-bottom:8px}
.badge{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 11px}
.badge.grey{background:var(--grey-bg);color:#5A6B8C}
.badge.green{background:var(--green-bg);color:var(--green-tx)}
.badge.orange{background:var(--orange-bg);color:var(--orange-tx)}
.btn{display:block;width:100%;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;margin-top:14px}
.btn.cy{background:#00BCD4}
.btn.ghost{background:#E0E7FF;color:var(--navy)}
.btn:disabled{opacity:.45;cursor:default}
input.inp,select.inp{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;font-size:15.5px;background:#F6F8FE;color:var(--navy);margin-top:6px}
label.fl{font-size:13.5px;font-weight:700;color:#5A6B8C;display:block;margin-top:14px}
.switch{position:relative;width:50px;height:28px;flex:none;cursor:pointer}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer}
.switch .tr{position:absolute;inset:0;background:#CBD5E8;border-radius:999px;transition:.2s;pointer-events:none}
.switch .tr:after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked + .tr{background:var(--blue)}
.switch input:checked + .tr:after{left:25px}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:15px}
.msg{margin:12px 16px 0;border-radius:12px;padding:13px 16px;font-size:14.5px;font-weight:600}
.msg.err{background:#FDECEC;color:#B3261E}
.msg.ok{background:var(--green-bg);color:#1E7A4C}
/* ---------- produits admin ---------- */
.prod-row{background:#fff;border-radius:18px;margin:12px 16px 0;padding:16px 18px;display:flex;gap:14px;align-items:center;cursor:pointer}
.prod-row .inf{flex:1}
.prod-row .nm{font-size:16.5px;font-weight:800;color:var(--navy)}
.prod-row .pr{font-size:15px;color:var(--navy);margin-top:3px}
.prod-row .pr s{color:var(--muted);font-weight:400;margin-right:7px}
.prod-row .st{font-size:13px;color:var(--muted2);margin-top:3px}
/* ---------- vitrine ---------- */
#shop{display:none}
.shop-head{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:6;box-shadow:0 1px 8px rgba(23,38,74,.06)}
.shop-head .nm{font-size:19px;font-weight:800;color:var(--navy)}
.shop-banner{background:#111;color:#7CFC9A;font-weight:800;text-align:center;padding:12px;font-size:16px;letter-spacing:.4px}
.shop-search{margin:14px 16px 4px;background:#F1F5F9;border-radius:12px;padding:13px 15px;color:#7A879E;display:flex;gap:9px;align-items:center;font-size:15px}
.shop-prod{background:#fff;border:1px solid var(--line);border-radius:14px;margin:12px 16px 0;overflow:hidden}
.shop-prod img{width:100%;height:190px;object-fit:cover;display:block}
.shop-prod .ph{height:190px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#fff}
.shop-prod .bd{padding:14px 16px}
.shop-prod .nm{font-size:16.5px;font-weight:700;color:var(--navy)}
.shop-prod .pr{margin-top:5px;font-size:16px;font-weight:800;color:var(--navy)}
.shop-prod .pr s{color:var(--muted);font-weight:400;margin-right:8px;font-size:14.5px}
.addbtn{margin-top:11px;width:100%;background:#E0E7FF;color:var(--navy);border:none;border-radius:10px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}
.addbtn:disabled{background:var(--grey-bg);color:var(--muted)}
.shop-foot{background:#111827;color:#C7CEDA;margin-top:26px;padding:26px 20px 110px;font-size:14px;line-height:1.7}
.shop-foot .pw{color:#8B96A9;font-size:13px;margin-top:10px}
.wa-float{position:fixed;bottom:96px;right:max(16px,calc(50% - 199px));width:56px;height:56px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:30;border:none;cursor:pointer}
.back-float{position:fixed;top:12px;left:max(12px,calc(50% - 203px));z-index:35;background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--navy);cursor:pointer;box-shadow:0 3px 10px rgba(23,38,74,.15)}
.steps{display:flex;justify-content:center;gap:8px;padding:16px 0 4px;font-size:12.5px;font-weight:800;color:var(--muted2)}
.steps .on{color:var(--navy)}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--line);background:#fff;font-size:17px;font-weight:700;color:var(--navy);cursor:pointer}
.cart-row{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.cart-row:last-child{border-bottom:none}
.pay-opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:13px;padding:14px;margin-top:10px;cursor:pointer;background:#fff}
.pay-opt.sel{border-color:var(--blue);background:#F5F8FF}
.pay-opt .t{font-weight:800;font-size:15.5px}
.pay-opt .d{font-size:13.5px;color:#5A6B8C;margin-top:2px;line-height:1.45}
.cartbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;padding:14px 16px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -2px 14px rgba(23,38,74,.08);z-index:40;display:flex;align-items:center;gap:14px}
.cartbar .tt{font-size:17px;font-weight:800}
.cartbar .btn{margin:0;flex:1;background:#F97316}

/* ---------- ajouts fonctionnels (patron mobile existant) ---------- */
textarea.inp{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:13px 14px;font-size:15.5px;background:#F6F8FE;color:var(--navy);margin-top:6px;font-family:inherit;resize:vertical;min-height:70px}
.fab{position:fixed;bottom:26px;right:max(18px,calc(50% - 197px));width:58px;height:58px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:32px;line-height:1;box-shadow:0 8px 20px rgba(46,91,255,.4);cursor:pointer;z-index:45;display:flex;align-items:center;justify-content:center}
.tabs3{display:flex;gap:8px;padding:14px 16px 2px}
.tabs3 button{flex:1;padding:11px 0;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--muted);cursor:pointer;font-size:14.5px}
.tabs3 button.on{background:var(--pill);color:var(--blue);border-color:var(--pill)}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 0}
.chip{padding:8px 15px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.chip.on{background:var(--pill);color:var(--blue);border-color:var(--pill)}
.mini{padding:9px 15px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;color:var(--navy);cursor:pointer;font-size:14px}
.mini.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.mini.red{color:#B3261E;border-color:#F0C4C1}
.btn.red{background:#D3382C}
.btn.sm{padding:11px;font-size:15px;margin-top:10px}
.btnrow{display:flex;gap:10px;padding:0 16px}
.btnrow .btn{flex:1}
.toast{position:fixed;bottom:112px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:999px;font-size:14.5px;font-weight:600;z-index:90;box-shadow:0 8px 22px rgba(23,38,74,.35);white-space:nowrap}
.bar-row{margin:10px 0}
.bar-row .t{display:flex;justify-content:space-between;font-size:14.5px;margin-bottom:5px}
.bar{height:8px;background:var(--pill);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}
table.mx{width:100%;border-collapse:collapse;font-size:12.8px}
table.mx th,table.mx td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.mx th{color:#5A6B8C;font-weight:700}
.sect{margin:20px 16px 0;font-size:12.5px;font-weight:800;color:var(--muted2);text-transform:uppercase;letter-spacing:.7px}
.varbtn{padding:9px 16px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:700;cursor:pointer;color:var(--navy);font-size:14.5px}
.varbtn.on{border-color:var(--blue);background:#F5F8FF;color:var(--blue)}
.notif-card{background:#fff;border-radius:18px;padding:16px 18px;margin:12px 16px 0;display:flex;gap:12px;cursor:pointer}
.notif-card .dotn{width:9px;height:9px;border-radius:50%;background:var(--blue);flex:none;margin-top:7px}
.notif-card.read{opacity:.62}
input[type=color].inp{padding:4px;height:50px}
.shop-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:#fff;display:flex;padding:8px 6px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -2px 14px rgba(23,38,74,.08);z-index:40}
.shop-nav button{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:2px 0 0}
.shop-nav .ic{width:52px;height:32px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.shop-nav button.on .ic{background:var(--pill)}
.shop-nav .lb{font-size:12.5px;color:var(--navy);font-weight:600}
.shop-nav button.on .lb{color:var(--blue);font-weight:700}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.shop-grid .shop-prod{margin:0}
.shop-grid .shop-prod img,.shop-grid .shop-prod .ph{height:110px}
.shop-prod.compact{margin:8px 16px 0}
.shop-prod.compact img,.shop-prod.compact .ph{height:90px}
.shop-prod.compact .bd{padding:10px 14px}
.checkrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}
.checkrow:last-child{border-bottom:none}
.checkrow input{width:19px;height:19px;accent-color:var(--blue)}
.help{font-size:13px;color:var(--muted2);line-height:1.5;margin-top:6px}
.kv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
select.inp{appearance:none}
.searchbox{margin:10px 16px 0;background:#fff;border-radius:14px;display:flex;align-items:center;gap:10px;padding:4px 16px;border:1.5px solid var(--line)}
.searchbox input{flex:1;border:none;background:none;padding:12px 0;font-size:15.5px;color:var(--navy);outline:none;font-family:inherit}
</style>
</head>
<body>
<div id="phone">
  <div id="admin">
    <main id="main"></main>
    <nav id="tabbar"></nav>
  </div>
  <div id="shop"></div>
</div>

const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');           // admin : 215 000
const fmtV=n=>'FBu '+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,','); // vitrine : FBu 215,000
const fmtC=n=>'FBu'+Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');   // vitrine compact : FBu215,000
const discOf=(reg,sell)=>reg>0?Math.floor((1-sell/reg)*100):0;
const stockOf=p=>p.variants.reduce((a,v)=>a+(+v.stock||0),0);
const prodById=id=>S.products.find(x=>x.id===id);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const todayStr=()=>new Date().toISOString().slice(0,10);
const dfr=ts=>{const d=new Date(ts);return d.toLocaleDateString('fr-FR');};
function rel(ts){const s=(Date.now()-ts)/1000;if(s<3600)return "à l'instant";if(s<86400)return 'il y a '+Math.floor(s/3600)+' h';if(s<86400*30)return 'il y a '+Math.floor(s/86400)+' j';if(s<86400*365)return 'il y a '+Math.floor(s/86400/30)+' mois';return 'il y a '+Math.floor(s/86400/365)+' ans';}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200);}
function copyTxt(txt,msg){const done=()=>toast(msg||'Copié');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done).catch(()=>{fallbackCopy(txt);done();});}else{fallbackCopy(txt);done();}}
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}ta.remove();}
function download(name,content){const b=new Blob([content],{type:'text/plain;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);}

function goTab(k){tab=k;stack=[];render();}
function push(v,arg){stack.push([v,arg]);render();}
function replaceTop(v,arg){if(stack.length)stack[stack.length-1]=[v,arg];else stack.push([v,arg]);render();}

 main.scrollTop=0;
}

/* règles d'application (6.4) — retourne {ok, discount, msg} */
function couponCheck(code,subtotal,phone){
 const c=S.coupons.find(x=>x.code===String(code||'').toUpperCase().trim());
 if(!c)return {ok:false,msg:'Coupon invalide.'};
 if(c.status!=='Active')return {ok:false,msg:'Coupon inactif.'};
 if(c.expiry&&c.expiry<todayStr())return {ok:false,msg:'Ce coupon a expiré le '+c.expiry.split('-').reverse().join('/')+'.'};
 if(c.minCart&&subtotal<c.minCart)return {ok:false,msg:'Panier minimum : '+fmt(c.minCart)+' FBu.'};
 if(c.maxUsage&&c.used>=c.maxUsage)return {ok:false,msg:'Coupon épuisé.'};
 if(c.maxPerCust&&phone&&(c.usedBy[phone]||0)>=c.maxPerCust)return {ok:false,msg:'Limite par client atteinte.'};
 if(c.tier){const ct=S.contacts.find(x=>(x.mobile||'').replace(/\s/g,'')===String(phone||'').replace(/\s/g,''));if(!ct||ct.tier!==c.tier)return {ok:false,msg:'Coupon réservé à un palier de clients.'};}
 let d=c.kind==='percent'?Math.floor(subtotal*c.value/100):c.value;
 if(c.maxDisc&&d>c.maxDisc)d=c.maxDisc;
 if(d>subtotal)d=subtotal;
 return {ok:true,discount:d,coupon:c};
}

VIEWS.paiements=function(){
 const gw=['Stripe','Razorpay','Paystack','Flutterwave','PayPal','Paytm','Midtrans','POLi'];
 return subHead('Modes de paiement')
 + payRowMLC('lumicash','Lumicash') + payRowMLC('enoti','eNoti')
 + `<div class="card" onclick="push('gwDetail','Pay Later')" style="cursor:pointer"><div class="row" style="padding:2px 0"><span style="font-weight:800;font-size:16.5px">Pay Later</span><span class="badge ${S.pay.paylater.on?'green':'grey'}">${S.pay.paylater.on?'Enabled':'Disabled'}</span></div></div>`
 + gw.map(g=>`<div class="card" onclick="push('gwDetail','${g}')" style="cursor:pointer"><div class="row" style="padding:2px 0"><span style="font-weight:800;font-size:16.5px">${g}</span><span class="badge grey">Currency Not Supported</span></div></div>`).join('')
 + `<div style="height:8px"></div>`;
};
const GW_FIELDS={Stripe:[['pub','Publishable Key'],['sec','Secret Key'],['wh','Webhook']],Razorpay:[['pub','Publishable Key (Key Id)'],['sec','Secret Key (Key Secret)'],['wh','Webhook']],Flutterwave:[['pub','Publishable Key (Public Key)'],['sec','Secret Key'],['enc','Encryption Key'],['wh','Webhook']],PayPal:[['pub','Client ID'],['sec','Secret Key'],['wh','Webhook']],Paytm:[['pub','Merchant ID'],['sec','Merchant Key'],['wh','Webhook URL']],Midtrans:[['pub','Client Key'],['sec','Server Key'],['wh','Payment Notification URL']]};

  <div class="checkrow"><span style="flex:1"><b>Enabled</b></span>${sw(S.pay.paylater.on,`S.pay.paylater.on=this.checked;save();render()`)}</div></div>`;

VIEWS.locCharges=function(id){
 const l=S.shipLocs.find(x=>x.id===id); if(!l)return subHead('Charges')+emptyZ();
 return subHead('Charges')+`<div class="card"><h3>${esc(l.city||'Location')}</h3>
 ${fld('Frais forfaitaire (vide = par tranches)',inpN('lc-flat',l.flat))}
 <h3 style="margin-top:16px">Tranches</h3>
 ${l.tranches.map((t,i)=>`<div style="display:flex;gap:8px;align-items:flex-end;margin-top:8px">
   <div style="flex:1">${fld('Min',inpN('tr-min'+i,t.min))}</div><div style="flex:1">${fld('Max',inpN('tr-max'+i,t.max))}</div><div style="flex:1">${fld('Charge',inpN('tr-ch'+i,t.charge))}</div>
   <button class="mini red" onclick="delTranche('${l.id}',${i})">✕</button></div>`).join('')}
 <button class="btn ghost" onclick="addTranche('${l.id}')">Add new</button>
 <button class="btn" onclick="saveTranches('${l.id}')">Save</button></div>
 <div class="help" style="padding:0 16px">Exemple : tranche 0–1000 → 50 ; tranche 1001–2000 → 75 ; ou un seul frais forfaitaire sans min ni max.</div>`;
};
function addTranche(id){saveTranches(id,true);const l=S.shipLocs.find(x=>x.id===id);l.tranches.push({min:0,max:0,charge:0});save();render();}
function delTranche(id,i){const l=S.shipLocs.find(x=>x.id===id);l.tranches.splice(i,1);save();render();}
function saveTranches(id,silent){const l=S.shipLocs.find(x=>x.id===id);l.flat=val('lc-flat');l.tranches=l.tranches.map((t,i)=>({min:valN('tr-min'+i),max:valN('tr-max'+i),charge:valN('tr-ch'+i)}));save();if(!silent){toast('Frais enregistrés');pop();}}
function shippingFor(subtotal,addr){
 if(!S.shipLocs.length)return 0;
 let l=null;
 if(addr){const city=(addr['City']||'').toLowerCase(),country=(addr['Country']||'').toLowerCase();
  l=S.shipLocs.find(x=>(x.city&&x.city.toLowerCase()===city)||(x.country&&x.country.toLowerCase()===country));}
 if(!l)l=S.shipLocs[0];
 if(l.flat!==''&&l.flat!=null)return +l.flat||0;
 const t=l.tranches.find(t=>subtotal>=(+t.min||0)&&(+(t.max)||Infinity)>=subtotal);
 return t?+t.charge||0:0;
}

function savePoll(id){
 const q=val('pl-q'); if(!q){toast('Question requise');return;}
 const opts=[];document.querySelectorAll('#pl-opts input').forEach(i=>{const v=i.value.trim();if(v)opts.push(v);});
 if(opts.length<2){toast('Au moins 2 options');return;}
 const data={question:q,multiple:val('pl-multiple')==='1',privacy:val('pl-privacy'),ends:val('pl-ends'),pinned:chk('pl-pinned'),storeVis:chk('pl-store'),status:val('pl-status')};
 if(id){const p=S.polls.find(x=>x.id===id);const old=p.options;p.options=opts.map(t=>{const o=old.find(x=>x.text===t);return o||{text:t,votes:[]};});Object.assign(p,data);}
 else S.polls.push(Object.assign({id:uid('pl'),options:opts.map(t=>({text:t,votes:[]})),archived:false,ts:Date.now()},data));
 save(); pop();
}

function recordVote(id){

  <div class="wrap"><div style="display:flex;align-items:center;justify-content:space-between;margin-top:16px"><span class="sec-title" style="margin:0">${shopCat?esc(shopCat):'Tous les articles'}</span><span style="font-size:13.5px;color:#5A6B8C">${S.theme.view==='Grid'?'Vue grille':S.theme.view==='Compact'?'Vue compacte':'Vue liste'} · Recommandé</span></div></div>`
  +(list.length?(S.theme.view==='Grid'?`<div class="shop-grid" style="margin-top:12px">${list.map(prodCard).join('')}</div>`:list.map(prodCard).join('')):'<div class="empty">Aucun article</div>')
  +`<div style="text-align:center;color:var(--muted);padding:20px 0 0">— C'est tout —</div>`;
 } else if(shopView==='cats'){
  const cats=S.categories.filter(c=>!c.archived);
  h+=`<div class="wrap"><h1 class="title" style="margin:14px 0 6px">Catégories</h1></div>`
  +cats.map(c=>{const n=S.products.filter(p=>p.status==='Active'&&p.cat===c.name).length;return `<div class="prod-row" onclick="shopCat='${esc(c.name)}';shopView='home';renderShop()"><div class="inf"><div class="nm">${esc(c.name)}</div><div class="st">${n} article${n>1?'s':''}</div></div>${IC.chevR('#8494B3',20)}</div>`;}).join('')
  +(shopCat?`<div style="padding:0 16px"><button class="btn ghost" onclick="shopCat='';renderShop()">Tous les articles</button></div>`:'');
 } else if(shopView==='product'){ h+=shopProductHtml(); }
 else if(shopView==='review'){ h+=`<div class="sub-head"><button class="back" onclick="shopView='product';renderShop()">${IC.back('#17264A',24)}</button><span class="t">Laisser un commentaire</span></div><div class="empty"></div>`; }
 else if(shopView==='cart'){ h+=shopCartHtml(); }
 else if(shopView==='login'){
  h+=`<div class="card" style="margin-top:22px"><h3>Se connecter</h3>
  <div class="help" style="margin:0">Connectez-vous pour voir vos commandes passées et bénéficier de vos prix de palier.</div>
  ${fld('Numéro de mobile',inp('lg-phone',S.client||'','type="tel" placeholder="+257 …"'))}
  <button class="btn" onclick="clientLogin()">Se connecter</button></div>`;
 } else if(shopView==='orders'){
  const mine=S.orders.filter(o=>(o.custPhone||'').replace(/\s/g,'')===(S.client||'').replace(/\s/g,'')).slice().reverse();
  h+=`<div class="wrap"><h1 class="title" style="margin:14px 0 6px">Mes commandes</h1></div>`
  +(mine.length?mine.map(o=>`<div class="order-card" onclick="shopOrderId=${o.id};shopView='order';renderShop()">
    <div class="r1"><span class="phone">Commande #${o.id}</span><span class="num">${dfr(o.ts)}</span></div><hr>
    <div class="r2"><div><div class="k">Statut</div><span class="v">${esc(o.status)}</span></div>
    <div><div class="k">Montant</div><span class="v">FBu${o.total}</span></div>
    <div><div class="k">Payment</div><span class="v">${esc(o.payment)}</span></div></div></div>`).join(''):'<div class="empty">Aucune commande</div>')
  +`<div style="padding:0 16px"><button class="btn ghost" onclick="S.client=null;save();shopView='home';renderShop()">Se déconnecter</button></div>`;
 } else if(shopView==='order'){
  const o=S.orders.find(x=>x.id===shopOrderId);
  if(o){h+=`<div class="wrap"><h1 class="title" style="margin:14px 0 6px">Commande #${o.id}</h1></div>
  <div class="card">${rowKV('Statut',esc(o.status))}${rowKV('Payment',esc(o.payment))}${rowKV('Payé via',esc(o.via))}${rowKV('Date',dfr(o.ts))}
  ${o.items.map(i=>`<div class="row"><span class="k">${esc(i.name)}${i.variant?' — '+esc(i.variant):''} × ${i.qty}</span><span class="v">${fmt(i.price*i.qty)} FBu</span></div>`).join('')}
  <div class="row" style="border-top:1px solid var(--line);margin-top:4px;padding-top:11px"><span class="k" style="font-weight:800;color:var(--navy)">Total</span><span class="v">${fmt(o.total)} FBu</span></div></div>
  <div style="padding:0 16px"><button class="btn ghost" onclick="shopView='orders';renderShop()">← Mes commandes</button></div>`;}
 }
 h+=`<div class="shop-foot"><div style="color:#fff;font-weight:800;font-size:16px">${esc(S.about.name)}</div>
 <div>${esc(S.about.slogan)}</div><div>🇫🇷 Français</div><div class="pw">Powered By MLC · Version 8.5.0</div></div>`
 +(shopView==='cart'?'':shopNav())
 +((shopView==='home'||shopView==='product')?`<button class="wa-float" onclick="waFloat()">${IC.wa('#fff',30)}</button>`:'')
 +`<div style="height:86px"></div>`;
 shopEl.innerHTML=h;
 window.scrollTo(0,0);
}
let shopOrderId=null;
function waFloat(){if(S.numbers.length){window.open('https://wa.me/'+S.numbers[0].replace(/\D/g,''),'_blank');}else{toast('Aucun numéro WhatsApp configuré');}}
function openProduct(id){shopPid=id;const p=prodById(id);shopVariant=p&&p.variants.length?p.variants[0].label:'';shopView='product';renderShop();}
function shopProductHtml(){
 const p=prodById(shopPid); if(!p)return '<div class="empty"></div>';
 const attrs={};p.variants.forEach(v=>{const m=v.label.match(/^([^:]+):\s*(.+)$/);if(m){(attrs[m[1]]=attrs[m[1]]||[]).push(m[2]);}});
 const curVar=p.variants.find(v=>v.label===shopVariant)||p.variants[0];
 const price=priceFor(p,curVar?curVar.label:'');
 const revs=S.reviews.filter(r=>r.pid===p.id);
 return `<div class="shop-prod" style="margin-top:14px">
  ${p.media0?`<img src="${esc(p.media0)}">`:p.img&&IMG[p.img]?`<img src="${IMG[p.img]}">`:`<div class="ph" style="background:${p.col}">${esc(p.name[0]||'?')}</div>`}
  <div class="bd">${p.badges.map(b=>`<span class="badge orange">${esc(b)}</span>`).join(' ')}
  <div class="nm" style="margin-top:7px;font-size:19px">${esc(p.name)}</div>
  ${Object.entries(attrs).map(([a,vals])=>`<div style="margin-top:12px"><div style="font-size:13.5px;color:#5A6B8C;font-weight:700">${esc(a)}</div>
   <div style="display:flex;gap:8px;margin-top:7px;flex-wrap:wrap">${vals.map(v=>{const lab=a+': '+v;return `<button class="varbtn ${shopVariant===lab?'on':''}" onclick="shopVariant='${esc(lab)}';renderShop()">${esc(v)}</button>`;}).join('')}</div></div>`).join('')}
  <div class="pr" style="font-size:19px">${fmtV(price)} <s>${fmtV(p.reg)}</s> <span class="badge green">${discOf(p.reg,p.sell)}% DE RÉDUCTION</span></div>
  ${p.oos||stockOf(p)<=0?`<button class="addbtn" disabled>Out of Stock</button>`:`<div style="display:flex;gap:9px"><button class="addbtn" style="flex:1;background:${S.theme.primary};color:#fff" onclick="buyNow('${p.id}')">Acheter maintenant</button>
  <button class="addbtn" style="flex:1" onclick="addToCart('${p.id}',true)">Ajouter au panier</button></div>`}
  ${p.desc?`<div style="margin-top:14px;font-size:15px;line-height:1.55">${esc(p.desc)}</div>`:''}
  ${p.link?`<div style="margin-top:8px"><a href="${esc(p.link)}" target="_blank" rel="noopener" style="color:var(--blue);font-weight:600">Plus de détails</a></div>`:''}
  </div></div>
 <div class="card"><h3>Évaluation et avis</h3>
 ${revs.length?revs.map(r=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><b>${esc(r.author||r.phone)}</b> <span style="color:#F5B800">${'★'.repeat(r.rating||5)}</span><div style="font-size:14.5px;margin-top:3px">${esc(r.text)}</div></div>`).join(''):'<div class="help">Aucun avis<br>Premier à revoir</div>'}
 <div style="margin-top:12px;font-size:14.5px;color:#5A6B8C">Vous avez acheté ce produit ? Connectez-vous et laissez votre précieux avis</div>
 <button class="btn ghost sm" onclick="shopReviewPid='${p.id}';shopView='review';renderShop()">Laisser un commentaire</button></div>`;
}
function addToCart(pid,stay){
 const p=prodById(pid); if(!p)return;
 const v=p.variants.find(x=>x.label===shopVariant&&shopPid===pid)||p.variants.slice().sort((a,b)=>a.price-b.price)[0];
 const label=v?v.label:'';
 const price=priceFor(p,label);
 const ex=S.cart.find(i=>i.pid===pid&&i.variant===label);
 if(ex)ex.qty++; else S.cart.push({pid:pid,variant:label,price:price,qty:1});
 save(); if(stay){toast('Ajouté au panier');renderShop();} else {shopView='cart';cartStep=1;renderShop();}
}
function buyNow(pid){addToCart(pid,false);}
function clientLogin(){const ph=val('lg-phone');if(!ph){toast('Numéro requis');return;}S.client=ph;save();shopView='orders';renderShop();}
/* ---- Panier 3 étapes ---- */
function setQty(idx,d){const it=S.cart[idx];if(!it)return;it.qty+=d;if(it.qty<1)S.cart.splice(idx,1);save();renderShop();}
function removeCartItem(idx){S.cart.splice(idx,1);save();renderShop();}
function clearCart(){S.cart=[];S.couponApplied=null;appliedDisc=0;save();renderShop();}
function shopCartHtml(){
 const steps=`<div class="steps"><span class="${cartStep===1?'on':''}">1 CHARIOT</span> · <span class="${cartStep===2?'on':''}">2 ADRESSE</span> · <span class="${cartStep===3?'on':''}">3 PAIEMENT</span></div>`;
 let body='';
 const sub=cartSubtotal();
 const ship=cartStep>=2?shippingFor(sub,S.shopAddr):0;
 const disc=appliedDisc||0;
 const total=Math.max(0,sub-disc)+ship;
 if(cartStep===1){
  body=S.cart.length?`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">${cartCount()} ARTICLES</h3><span style="color:var(--blue);font-weight:600;cursor:pointer" onclick="clearCart()">vider panier</span></div>
  ${S.cart.map((i,x)=>{const p=prodById(i.pid);if(!p)return '';return `<div class="cart-row">
    <div style="flex:1"><div style="font-weight:700">${esc(p.name)}</div>
    <div style="font-size:13.5px;color:#5A6B8C;margin-top:2px">Prix: ${fmtV(i.price)} ${fmtV(p.reg)} ${discOf(p.reg,p.sell)}% DE RÉDUCTION</div>
    ${i.variant?`<div style="font-size:13.5px;color:#5A6B8C">${esc(i.variant)}</div>`:''}
    <div style="font-size:13.5px;color:var(--blue);cursor:pointer;margin-top:3px" onclick="removeCartItem(${x})">Retirer</div></div>
    <div class="qty"><button onclick="setQty(${x},-1)">−</button><b>${i.qty}</b><button onclick="setQty(${x},1)">+</button></div>
    <div style="font-weight:800;min-width:92px;text-align:right">${fmtC(i.price*i.qty)}</div></div>`;}).join('')}</div>
  <div class="card"><label class="fl" style="margin-top:0">Appliquer Coupon</label>
   <div style="display:flex;gap:9px"><input class="inp" id="coupon" placeholder="Code coupon" style="flex:1" value="${S.couponApplied?esc(S.couponApplied):''}"><button class="btn ghost" style="margin:6px 0 0;width:auto;padding:0 18px" onclick="applyCoupon()">Appliquer</button></div>
   ${couponMsg?`<div style="margin-top:9px;font-size:14px;font-weight:600;color:${couponMsg.ok?'#1E7A4C':'#B3261E'}">${esc(couponMsg.t)}</div>`:''}
   <div style="margin-top:10px;font-size:14.5px;color:#2E7CF6;cursor:pointer" onclick="shareCartWA()">Partager le panier sur WhatsApp</div></div>
  <div class="card">
   <div class="row"><span class="k">Total</span><span class="v">${fmtC(sub)}</span></div>
   ${disc?`<div class="row"><span class="k">Discount</span><span class="v">−${fmtC(disc)}</span></div>`:''}
   <div class="row"><span class="k">Frais supplémentaires</span><span class="v">${fmtC(0)}</span></div>
   <div class="row"><span class="k">Frais de livraison</span><span class="v">${fmtC(ship)}</span></div>
   <div class="row"><span class="k">Taxes et frais</span><span class="v">${fmtC(0)}</span></div>
   <div class="row" style="border-top:1px solid var(--line);margin-top:4px;padding-top:11px"><span class="k" style="font-weight:800;color:var(--navy)">Total</span><span class="v">${fmtC(total)}</span></div></div>`
  :`<div class="empty">Votre chariot est vide</div>`;
 } else if(cartStep===2){
  const f=S.checkout.addrFields; const a=S.shopAddr||{};
  body=`<div class="card"><h3>Adresse de livraison</h3>
  ${S.checkout.userVerif.mobile?fld('Mobile Number',inp('ad-Mobile',a['Mobile']||'','type="tel" placeholder="+257 …"')):''}
  ${Object.keys(f).filter(k=>f[k]).map(k=>fld(k,inp('ad-'+k.replace(/[^a-zA-Z0-9]/g,''),a[k]||''))).join('')}
  </div>`;
 } else if(cartStep===3){
  const opts=[];
  if(S.pay.lumicash.on&&S.pay.lumicash.num)opts.push(['Lumicash','Payez au numéro marchand : '+S.pay.lumicash.num+' — puis saisissez la référence de la transaction.']);
  if(S.pay.enoti.on&&S.pay.enoti.num)opts.push(['eNoti','Payez au numéro marchand : '+S.pay.enoti.num+' — puis saisissez la référence de la transaction.']);
  if(S.pay.paylater.on)opts.push(['Pay Later','Payez plus tard, à la livraison.']);
  if(!payChoice||!opts.find(o=>o[0]===payChoice))payChoice=opts.length?opts[0][0]:null;
  body=opts.length?`<div class="card"><h3>Mode de paiement</h3>
  ${opts.map(([t,d])=>`<div class="pay-opt ${payChoice===t?'sel':''}" onclick="payChoice='${t}';renderShop()"><div><div class="t">${t}</div><div class="d">${esc(d)}</div></div></div>`).join('')}
  ${payChoice&&payChoice!=='Pay Later'?fld('Référence de la transaction',inp('co-ref','','placeholder="Référence"')):''}
  <div class="card" style="margin:14px 0 0;padding:0">
   <div class="row"><span class="k">Total</span><span class="v">${fmtC(sub)}</span></div>
   ${disc?`<div class="row"><span class="k">Discount</span><span class="v">−${fmtC(disc)}</span></div>`:''}
   <div class="row"><span class="k">Frais de livraison</span><span class="v">${fmtC(ship)}</span></div>
   <div class="row"><span class="k" style="font-weight:800;color:var(--navy)">Total</span><span class="v">${fmtC(total)}</span></div></div></div>
  <div id="co-err"></div>`
  :`<div class="card"><div class="help" style="margin:0">Aucun mode de paiement disponible.</div></div>`;
 }
 const labels={1:'Adresse',2:'Paiement',3:'Commander'};
 return steps+body+((S.cart.length||cartStep>1)?`<div class="cartbar"><span class="tt">Total ${fmtC(total)}</span><button class="btn" onclick="cartNext()">${labels[cartStep]}</button></div>`:'');
}
function applyCoupon(){
 const code=val('coupon'); const phone=(S.shopAddr&&S.shopAddr['Mobile'])||S.client||'';
 const r=couponCheck(code,cartSubtotal(),phone);
 if(r.ok){S.couponApplied=r.coupon.code;appliedDisc=r.discount;couponMsg={ok:true,t:'Coupon appliqué : −'+fmt(r.discount)+' FBu'};}
 else{S.couponApplied=null;appliedDisc=0;couponMsg={ok:false,t:r.msg};}
 save(); renderShop();
}
function shareCartWA(){
 const lines=S.cart.map(i=>{const p=prodById(i.pid);return (p?p.name:'')+(i.variant?' ('+i.variant+')':'')+' x'+i.qty+' : '+fmtC(i.price*i.qty);});
 const txt=encodeURIComponent(S.about.name+' — Panier\n'+lines.join('\n')+'\nTotal '+fmtC(cartSubtotal()));
 const num=S.numbers.length?S.numbers[0].replace(/\D/g,''):'';
 window.open('https://wa.me/'+num+'?text='+txt,'_blank');
}
function cartNext(){
 if(cartStep===1){if(!S.cart.length)return;cartStep=2;renderShop();return;}
 if(cartStep===2){
  const a={};const f=S.checkout.addrFields;
  if(S.checkout.userVerif.mobile)a['Mobile']=val('ad-Mobile');
  Object.keys(f).filter(k=>f[k]).forEach(k=>{a[k]=val('ad-'+k.replace(/[^a-zA-Z0-9]/g,''));});
  S.shopAddr=a;save();cartStep=3;renderShop();return;
 }
 /* étape 3 : validation */
 const sub=cartSubtotal();
 if(S.checkout.minOrder&&sub<S.checkout.minOrder){
  document.getElementById('co-err').innerHTML='<div class="msg err">Montant minimum de commande : '+fmt(S.checkout.minOrder)+' FBu.</div>';return;
 }
 if(!payChoice){document.getElementById('co-err').innerHTML='<div class="msg err">Aucun mode de paiement disponible.</div>';return;}
 const refEl=document.getElementById('co-ref'); const ref=refEl?refEl.value.trim():'';
 if(payChoice!=='Pay Later'&&!ref){document.getElementById('co-err').innerHTML='<div class="msg err">Référence de la transaction requise.</div>';return;}
 const a=S.shopAddr||{};
 const phone=a['Mobile']||S.client||'';
 const ship=shippingFor(sub,a);
 const total=Math.max(0,sub-(appliedDisc||0))+ship;
 const o={id:S.nextOrder++,ref:'',phone:phone?'+ '+phone.replace(/^\+/,'').replace(/\s/g,''):'' ,custPhone:phone,status:'Open',
  payment:payChoice==='Pay Later'?'Unpaid':'Paid',via:payChoice,txn:payChoice==='Pay Later'?'':ref,placedBy:'user',ts:Date.now(),
  shipTo:Object.values(a).filter(Boolean).join(', '),note:'',
  items:S.cart.map(i=>{const p=prodById(i.pid);return {pid:i.pid,name:p?p.name:'',variant:i.variant,cat:p?p.cat:'',sku:'',price:i.price,qty:i.qty};}),
  discount:appliedDisc||0,shipping:ship,taxes:0,adjustment:0,total:total,
  activity:[{t:'Order Created',ts:Date.now()}]};
 /* décrément du stock (attesté à la validation) */
 o.items.forEach(i=>{const p=prodById(i.pid);if(p&&p.manageInv){const v=p.variants.find(x=>x.label===i.variant)||p.variants[0];if(v)v.stock=Math.max(0,(+v.stock||0)-i.qty);}});
 /* coupon : compteur d'usage */
 if(S.couponApplied){const c=S.coupons.find(x=>x.code===S.couponApplied);if(c){c.used++;if(phone)c.usedBy[phone]=(c.usedBy[phone]||0)+1;}}
 /* contact client créé si inconnu */
 if(phone&&!S.contacts.some(c=>(c.mobile||'').replace(/\s/g,'')===phone.replace(/\s/g,''))){
  S.contacts.push({id:uid('ct'),salutation:'',name:a['Name']||'',mobile:phone,email:a['Email']||'',company:'',gender:'',city:a['City']||'',address:[a['Address Line 1'],a['Address Line 2']].filter(Boolean).join(' '),notes:'',funnel:'',tags:[],tier:'',status:'Unlocked'});
 }
 S.orders.push(o);
 notify('Nouvelle commande #'+o.id,(o.custPhone||'')+' — '+fmt(o.total)+' FBu ('+o.via+')');
 S.cart=[];S.couponApplied=null;appliedDisc=0;couponMsg='';S.client=phone||S.client;
 save();
 shopEl.innerHTML=shopHead()+`<div class="card" style="margin-top:22px;text-align:center;padding:30px 20px">
 <div style="font-size:19px;font-weight:800">Commande reçue</div>
 <div style="color:#5A6B8C;margin-top:8px;font-size:15px;line-height:1.6">Commande #${o.id} · ${fmt(o.total)} FBu · ${esc(o.via)}<br>Payment : ${o.payment}</div>
 <button class="btn" onclick="shopView='orders';renderShop()">Voir mes commandes</button>
 <button class="btn ghost" onclick="shopView='home';renderShop()">Retour à la boutique</button></div>`+shopNav()+`<div style="height:86px"></div>`;
 window.scrollTo(0,0);
}
/* ---- avis client (formulaire de dépôt non relevé → écran titre seul) ---- */
let shopReviewPid=null;

/* ==================== démarrage ==================== */
render();

</script>
</body>
</html>
